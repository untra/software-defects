defects:
- id: mutated-state
  cwe_pillar:
    id: CWE-664
    name: Improper Control of a Resource Through its Lifetime
    url: https://cwe.mitre.org/data/definitions/664.html
  name: Bugs of Mutated State
  short_name: Mutated
  category: mutated
  tagline: changing the state of a program
  color_primary: 78A65A
  color_secondary: 93C47D
  color_deep: 4F7942
  description: Bugs caused by changing the state of a program in ways that create unpredictability, where
    information and control flow become untraced.
  essence: Results diverge from expectations when state changes go untracked.
  symptoms:
  - Wrong or unexpected results
  - Unpredictable function output or operation
  - Edge cases abounding in code
  - Test flakiness and complexity
  causes:
  - var / let / mut declarations
  - off-by-one errors
  - for-loop control flow
  - this mutation
  - time / money / entropy
  - impure functions
  - macro / mixin misuse
  - ++ / -- & integer overflow
  - improper initialization
  tools_hurt:
  - let / var / mut
  - for loops and control flow
  - classes and this misuse
  - uninitialized state / defaults
  - Math.random() & Date.now()
  - macros & mixin misuse
  - ++ / -- & overflow
  - binary operators
  philosophies:
  - name: Reactive Manifesto
    url: https://www.reactivemanifesto.org
  - name: Why Functional Programming Matters
    url: https://www.cs.kent.ac.uk/people/staff/dat/miranda/whyfp90.pdf
  - name: Tidy Tools Manifesto
    url: https://tidyverse.tidyverse.org/articles/manifesto.html
  - name: 'Refactoring Guru: State'
    url: https://refactoring.guru/design-patterns/state
  pullquote:
    text: Through gradual practice and research, write entirely pure functions in typed languages on sandboxed
      VMs in a Faraday cage — only then can you never make a mistake when writing software.
    attribution: the unreachable ideal (said with a wink)
  two_hard_note: null
  defects:
  - slug: var-let-mut
    cwes:
    - id: CWE-457
      name: Use of Uninitialized Variable
      url: https://cwe.mitre.org/data/definitions/457.html
    - id: CWE-563
      name: Assignment to Variable without Use
      url: https://cwe.mitre.org/data/definitions/563.html
    name: var / let / mut Declarations
    tagline: mutable bindings that drift out from under you
    essence: A binding you can reassign is a binding the next reader cannot trust.
    description: Reassignable variables and secretly-shared defaults let state change between reads, so
      the value you assume is rarely the value you hold.
    examples:
    - title: Reassignment You Can't Trust
      intent: A binding you can reassign can change between the moment a callback captures it and the
        moment it runs.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// SMELL: `let` can be rebound after a callback captures it

          let config = loadConfig();

          schedule(() => save(config));   // captures the BINDING, not the value

          config = reloadConfig();        // the callback will now see this one


          // RIGHT: a fresh const per value; nothing can rebind it

          const config = loadConfig();

          schedule(() => save(config));   // this exact config, always'
        explanation: A closure captures the variable, not a snapshot. Reassigning let later silently changes
          what the callback sees.
        output: 'let:   callback saves the reloaded config

          const: callback saves the config it was given'
      - name: Rust
        slug: rust
        code: '// Rust makes mutation opt-in and visible.

          let x = 5;

          // x = 6;          // compile error: cannot assign twice


          let mut y = 5;     // `mut` is a loud, searchable marker

          y = 6;             // allowed -- and obvious in review


          // Prefer shadowing to transform without mutating:

          let total = 5;

          let total = total + 1;   // new binding, old one untouched'
        explanation: Immutability is the default; mut is a keyword you must type and a reviewer can grep
          for.
        output: 'without mut: reassignment refused at compile time

          with mut:   permitted, but explicit and auditable'
    - title: var Hoisting & Scope Leak
      intent: var ignores block scope and hoists to the top of the function, so a name leaks past where
        you declared it.
      languages:
      - name: JavaScript
        slug: javascript
        code: "// SMELL: var is hoisted and function-scoped\nfunction lookup(list) {\n  for (var i = 0;\
          \ i < list.length; i++) {\n    if (list[i] === null) break;\n  }\n  return i;          // <--\
          \ i still visible here; leaks the loop counter\n}\n\n// RIGHT: let is block-scoped; the name\
          \ cannot escape\nfunction lookup(list) {\n  let found = -1;\n  for (let i = 0; i < list.length;\
          \ i++) {\n    if (list[i] === null) { found = i; break; }\n  }\n  return found;\n}"
        explanation: var hoists to the function top, so i outlives the loop. let keeps the binding inside
          the block where it belongs.
        output: 'var: returns the leaked counter, even after the loop

          let: i does not exist outside the loop'
      - name: Python
        slug: python
        code: "# Python has no block scope either: the loop var leaks\nfor row in rows:\n    if row.done:\n\
          \        break\nprint(row)        # <-- 'row' is whatever the loop left behind\n\n# RIGHT: capture\
          \ what you mean explicitly\nlast = next((r for r in rows if r.done), None)\nprint(last)"
        explanation: After a for-loop the loop variable keeps its final value. Relying on that leaked
          binding hides intent.
        output: 'leak:  prints the last-seen row, not necessarily a ''done'' one

          right: ''last'' is exactly the row you searched for'
  - slug: aliasing-mutable-defaults
    cwes:
    - id: CWE-374
      name: Passing Mutable Objects to an Untrusted Method
      url: https://cwe.mitre.org/data/definitions/374.html
    - id: CWE-375
      name: Returning a Mutable Object to an Untrusted Caller
      url: https://cwe.mitre.org/data/definitions/375.html
    - id: CWE-471
      name: Modification of Assumed-Immutable Data (MAID)
      url: https://cwe.mitre.org/data/definitions/471.html
    name: Aliasing & Mutable Defaults
    tagline: two names for one value that changes under both
    essence: When two references share one mutable value, a write through either is a surprise to the
      other.
    description: 'A default created once and shared across calls, or two variables bound to the same object:
      mutate through one name and every other name sees it, because they were never separate values.'
    examples:
    - title: Shared Mutable Defaults
      intent: A default value created once at definition time is silently shared across every call.
      languages:
      - name: Python
        slug: python
        code: "# CLASSIC TRAP: the default list is created once and shared\ndef append(item, bucket=[]):\n\
          \    bucket.append(item)\n    return bucket\n\nappend(1)   # [1]\nappend(2)   # [1, 2]  <--\
          \ not what anyone expects\n\n# RIGHT: sentinel default, fresh value each call\ndef append(item,\
          \ bucket=None):\n    bucket = [] if bucket is None else bucket\n    bucket.append(item)\n  \
          \  return bucket"
        explanation: Default arguments are evaluated once at definition time. The mutable list leaks state
          between unrelated calls.
        output: 'trap:  append(1)->[1], append(2)->[1, 2]

          right: append(1)->[1], append(2)->[2]'
      - name: JavaScript
        slug: javascript
        code: "// SMELL: one object literal shared as a default by every caller\nconst SHARED = {};\n\
          function tag(item, into = SHARED) {   // default is the SAME object each call\n  into[item]\
          \ = true;\n  return into;\n}\ntag(\"a\"); tag(\"b\");   // { a: true, b: true } -- leaked across\
          \ calls\n\n// RIGHT: build a fresh container when none is passed\nfunction tag(item, into) {\n\
          \  into = into ?? {};\n  into[item] = true;\n  return into;\n}"
        explanation: A shared default object accumulates state between unrelated calls. Default to a sentinel
          and allocate a fresh value inside.
        output: 'shared: { a: true, b: true }

          fresh:  { a: true }, { b: true }'
    - title: Reference Aliasing
      intent: Two names bound to one object are not two values -- a write through one is visible through
        the other.
      languages:
      - name: Python
        slug: python
        code: '# SMELL: b is not a copy -- it''s the same list

          a = [1, 2, 3]

          b = a

          b.append(4)

          print(a)        # [1, 2, 3, 4]  <-- a changed too


          # RIGHT: copy when you mean a separate value

          b = a.copy()    # or list(a) / a[:]

          b.append(4)

          print(a)        # [1, 2, 3]'
        explanation: Assignment binds a new name to the same object. Mutating through either name mutates
          the one shared list.
        output: 'alias: a == [1, 2, 3, 4]

          copy:  a == [1, 2, 3]'
      - name: Go
        slug: go
        code: '// SMELL: slices share the same backing array

          a := []int{1, 2, 3}

          b := a[:2]

          b = append(b, 99)     // writes into a''s backing array

          // a is now [1 2 99]


          // RIGHT: copy into a fresh slice when you need independence

          b := make([]int, 2)

          copy(b, a[:2])

          b = append(b, 99)     // a is untouched'
        explanation: A re-slice points at the same backing array, so append can write through the alias
          until the array has to grow.
        output: 'alias: a == [1 2 99]

          copy:  a == [1 2 3]'
  - slug: for-loop-control-flow
    cwes:
    - id: CWE-193
      name: Off-by-one Error
      url: https://cwe.mitre.org/data/definitions/193.html
    - id: CWE-834
      name: Excessive Iteration
      url: https://cwe.mitre.org/data/definitions/834.html
    name: for-Loop Control Flow
    tagline: hand-rolled counters and tangled break / continue
    essence: Manual loop control invites the index and the collection to disagree.
    description: When you drive iteration by hand — a counter, a captured variable, an in-place edit —
      the loop and the data fall out of sync.
    examples:
    - title: Closure Captures the Loop Variable
      intent: Every closure created in the loop shares one binding, so they all see its final value.
      languages:
      - name: JavaScript
        slug: javascript
        code: "// SMELL: var shares ONE binding across the whole loop\nconst fns = [];\nfor (var i = 0;\
          \ i < 3; i++) {\n  fns.push(() => i);\n}\nfns.map(f => f());   // [3, 3, 3]\n\n// RIGHT: let\
          \ gives each iteration its own binding\nfor (let i = 0; i < 3; i++) {\n  fns.push(() => i);\n\
          }\nfns.map(f => f());   // [0, 1, 2]"
        explanation: var is one binding mutated in place; every closure reads its last value. let is fresh
          per iteration.
        output: 'var: [3, 3, 3]

          let: [0, 1, 2]'
      - name: Python
        slug: python
        code: '# SMELL: lambdas close over the variable, not its value

          fns = [lambda: i for i in range(3)]

          [f() for f in fns]          # [2, 2, 2]


          # RIGHT: bind the current value as a default argument

          fns = [lambda i=i: i for i in range(3)]

          [f() for f in fns]          # [0, 1, 2]'
        explanation: Python closures capture the variable by reference. A default argument snapshots the
          value at definition time.
        output: 'late-binding: [2, 2, 2]

          snapshot:    [0, 1, 2]'
    - title: Mutating a Collection While Iterating
      intent: Removing from the very list you are looping over makes the cursor skip elements.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: deleting while iterating shifts items under the cursor\nnums = [1, 2, 2, 3]\n\
          for n in nums:\n    if n == 2:\n        nums.remove(n)      # skips the second 2\n# nums ->\
          \ [1, 2, 3]\n\n# RIGHT: build a new list; never mutate what you iterate\nnums = [n for n in\
          \ nums if n != 2]   # [1, 3]"
        explanation: remove() shifts every later element down one, so the loop's index jumps past the
          next match.
        output: 'in-place: [1, 2, 3]   (one 2 survives)

          filter:   [1, 3]'
      - name: Java
        slug: java
        code: "// SMELL: structural change during iteration -> exception\nfor (String s : list) {\n  \
          \  if (s.isBlank()) list.remove(s);   // ConcurrentModificationException\n}\n\n// RIGHT: removeIf,\
          \ or an explicit Iterator.remove()\nlist.removeIf(String::isBlank);"
        explanation: The for-each iterator fails fast when the collection changes under it. removeIf mutates
          safely in one pass.
        output: 'for-each: ConcurrentModificationException

          removeIf: blanks removed cleanly'
  - slug: this-mutation
    cwes:
    - id: CWE-374
      name: Passing Mutable Objects to an Untrusted Method
      url: https://cwe.mitre.org/data/definitions/374.html
    - id: CWE-375
      name: Returning a Mutable Object to an Untrusted Caller
      url: https://cwe.mitre.org/data/definitions/375.html
    - id: CWE-471
      name: Modification of Assumed-Immutable Data (MAID)
      url: https://cwe.mitre.org/data/definitions/471.html
    name: this Mutation
    tagline: methods that rewrite the object they live on
    essence: When a method mutates this, every caller is coupled to call order.
    description: A method quietly rewrites the object it lives on — or loses its receiver entirely — so
      a later read sees a value nobody assigned on purpose.
    examples:
    - title: Mutating this In Place
      intent: A method quietly rewrites the object it lives on, so a later read sees a value nobody assigned
        on purpose.
      languages:
      - name: JavaScript
        slug: javascript
        code: "class Cart {\n  constructor() { this.items = []; }\n\n  // SMELL: mutates this and returns\
          \ nothing useful\n  add(item) { this.items.push(item); }\n}\n\n// RIGHT: return a new cart,\
          \ never mutate in place\nconst add = (cart, item) => ({ items: [...cart.items, item] });"
        explanation: Mutating this couples every caller to call order. Returning a fresh value makes the
          operation a pure function.
        output: 'mutating: order of add() calls changes shared state

          pure:     each call is independent and replayable'
      - name: Python
        slug: python
        code: "class Counter:\n    def __init__(self):\n        self.n = 0\n\n    # SMELL: side effect\
          \ on self, no return\n    def bump(self):\n        self.n += 1\n\n# RIGHT: a value object that\
          \ returns a new instance\nfrom dataclasses import dataclass, replace\n\n@dataclass(frozen=True)\n\
          class Counter:\n    n: int = 0\n    def bump(self):\n        return replace(self, n=self.n +\
          \ 1)"
        explanation: A frozen dataclass cannot be mutated, so bump() must hand back a new value. State
          changes become traceable.
        output: 'mutable: c.bump() changes c in place

          frozen:  c2 = c.bump(); c is untouched'
    - title: Losing this in a Callback
      intent: Pass a method as a callback and it forgets which object it belonged to.
      languages:
      - name: JavaScript
        slug: javascript
        code: "class Timer {\n  constructor() { this.count = 0; }\n  tick() { this.count++; }      //\
          \ depends on `this`\n}\nconst t = new Timer();\n\n// SMELL: passing the method drops its receiver\n\
          setInterval(t.tick, 1000);      // TypeError: this is undefined\n\n// RIGHT: bind the receiver,\
          \ or wrap in an arrow\nsetInterval(() => t.tick(), 1000);"
        explanation: A bare method reference loses its `this`. An arrow wrapper (or .bind(t)) preserves
          the receiver.
        output: 'bare:  this is undefined inside tick()

          arrow: t.count increments as expected'
      - name: Python
        slug: python
        code: "class Timer:\n    def __init__(self): self.count = 0\n    def tick(self): self.count +=\
          \ 1\n\nt = Timer()\n\n# A *bound* method keeps its self -- this is safe in Python\nschedule(t.tick)\
          \            # fine: t.tick is bound to t\n\n# SMELL: the *unbound* function needs self passed\
          \ in\nschedule(Timer.tick)        # TypeError: missing 'self'"
        explanation: Python binds self when you access t.tick. Reaching through the class instead drops
          the receiver, mirroring the JS trap.
        output: 'bound:   t.count increments

          unbound: TypeError, no self supplied'
  - slug: time-money-entropy
    cwes:
    - id: CWE-330
      name: Use of Insufficiently Random Values
      url: https://cwe.mitre.org/data/definitions/330.html
    - id: CWE-340
      name: Generation of Predictable Numbers or Identifiers
      url: https://cwe.mitre.org/data/definitions/340.html
    - id: CWE-1339
      name: Insufficient Precision or Accuracy of a Real Number
      url: https://cwe.mitre.org/data/definitions/1339.html
    - id: CWE-682
      name: Incorrect Calculation
      url: https://cwe.mitre.org/data/definitions/682.html
    name: Time, Money & Entropy
    tagline: reading the clock, the coin, and the dice
    essence: A function that consults wall-clock time or money in floats answers differently every call.
    description: Hidden inputs from the outside world — the system clock and floating-point money — make
      the same call return a different answer each time.
    examples:
    - title: Reading the Wall Clock
      intent: A function that calls the clock can never be replayed; its answer depends on when you ran
        it.
      languages:
      - name: JavaScript
        slug: javascript
        code: "// IMPURE: result depends on the wall clock\nfunction greeting() {\n  return new Date().getHours()\
          \ < 12 ? \"Good morning\" : \"Good evening\";\n}\n\n// PURE: inject the hour; same input, same\
          \ output, every time\nconst greet = (hour) =>\n  hour < 12 ? \"Good morning\" : \"Good evening\"\
          ;"
        explanation: Pass the clock in as an argument. Now the function is deterministic and trivially
          testable.
        output: 'impure: greeting() flips at noon, untestable

          pure:   greet(9) is always ''Good morning'''
      - name: Python
        slug: python
        code: "from datetime import datetime, timezone\n\n# IMPURE: uses 'now' and the machine's local\
          \ timezone\ndef is_expired(token):\n    return token.expires_at < datetime.now()   # naive +\
          \ nondeterministic\n\n# PURE: inject an explicit, timezone-aware 'now'\ndef is_expired(token,\
          \ now):\n    return token.expires_at < now\n\nis_expired(tok, datetime.now(timezone.utc))"
        explanation: datetime.now() is both nondeterministic and timezone-naive. Injecting an aware 'now'
          fixes correctness and testability at once.
        output: 'impure: result depends on server clock & locale

          pure:   pass a fixed ''now'' to test any moment'
    - title: Money in Floating Point
      intent: Binary floats cannot represent most decimals, so currency math drifts by pennies.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// SMELL: dollars as floats

          0.1 + 0.2;                 // 0.30000000000000004

          (0.1 + 0.2).toFixed(2);    // "0.30"  -- hides, doesn''t fix


          // RIGHT: work in integer cents, format only at the edge

          const cents = (a, b) => a + b;     // 10 + 20 -> 30

          const fmt = (c) => `$${(c / 100).toFixed(2)}`;'
        explanation: Floats round in binary, so decimals accumulate error. Store money as integer cents
          and only divide when displaying.
        output: 'float: 0.1 + 0.2 = 0.30000000000000004

          cents: 10 + 20 = 30 -> "$0.30"'
      - name: Python
        slug: python
        code: '# SMELL: float money accrues rounding error

          total = 0.1 + 0.2          # 0.30000000000000004


          # RIGHT: Decimal keeps base-10 money exact

          from decimal import Decimal

          total = Decimal("0.1") + Decimal("0.2")   # Decimal(''0.3'')'
        explanation: Decimal does base-10 arithmetic, so currency values stay exact. Never let user-facing
          money live in a binary float.
        output: 'float:   0.30000000000000004

          Decimal: 0.3'
  - slug: impure-functions
    cwes:
    - id: CWE-330
      name: Use of Insufficiently Random Values
      url: https://cwe.mitre.org/data/definitions/330.html
    - id: CWE-338
      name: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)
      url: https://cwe.mitre.org/data/definitions/338.html
    - id: CWE-374
      name: Passing Mutable Objects to an Untrusted Method
      url: https://cwe.mitre.org/data/definitions/374.html
    name: Impure Functions
    tagline: hidden inputs, hidden effects
    essence: A function whose result depends on more than its arguments cannot be trusted or tested.
    description: Randomness, global reads, and arguments mutated in place make a call's behavior depend
      on — and change — the world around it.
    examples:
    - title: Nondeterministic Randomness
      intent: A function that reaches for a random source gives a different answer on every run.
      languages:
      - name: Python
        slug: python
        code: "import random\n\n# IMPURE: nondeterministic, untestable\ndef roll():\n    return random.randint(1,\
          \ 6)\n\n# PURE: inject the source of entropy\ndef roll(rng):\n    return rng.randint(1, 6)\n\
          \nroll(random.Random(42))     # repeatable in tests"
        explanation: 'Injecting rng makes randomness reproducible: seed it in tests, use a real source
          in production.'
        output: 'impure: roll() differs each run

          pure:   roll(Random(42)) is always the same'
      - name: Solidity
        slug: solidity
        code: "// ENTROPY in the worst place: a smart contract.\n// SMELL: block values are attacker-influenced\
          \ \"randomness\"\nfunction badRandom() public view returns (uint) {\n    return uint(keccak256(abi.encode(block.timestamp)))\
          \ % 100;\n}\n\n// RIGHT: use a verifiable random function (Chainlink VRF)\n// instead of block.timestamp\
          \ / blockhash."
        explanation: On-chain, time and entropy are public and miner-influenced. Money bugs here are irreversible
          — fintech at scale means no backsies.
        output: 'bad:   miners can steer block.timestamp to win

          right: VRF gives entropy nobody can predict'
    - title: Mutating Your Arguments
      intent: A function that edits the value passed in changes the caller's world behind its back.
      languages:
      - name: JavaScript
        slug: javascript
        code: "// SMELL: sort() mutates the array it is called on\nfunction topThree(scores) {\n  return\
          \ scores.sort((a, b) => b - a).slice(0, 3);\n}\nconst data = [3, 1, 2];\ntopThree(data);\ndata;\
          \          // [3, 2, 1]  <-- caller's array was reordered!\n\n// RIGHT: copy before you transform\n\
          const topThree = (s) => [...s].sort((a, b) => b - a).slice(0, 3);"
        explanation: Array.sort sorts in place and returns the same array. Spread into a fresh array so
          the caller's data is untouched.
        output: 'mutating: data becomes [3, 2, 1]

          pure:     data stays [3, 1, 2]'
      - name: Python
        slug: python
        code: "# SMELL: the helper mutates the list it was handed\ndef normalize(items):\n    items.sort()\n\
          \    return items\n\ndata = [3, 1, 2]\nnormalize(data)\ndata            # [1, 2, 3]  <-- surprise\
          \ side effect\n\n# RIGHT: return a new, sorted list\ndef normalize(items):\n    return sorted(items)"
        explanation: list.sort() mutates in place; sorted() returns a new list and leaves the argument
          alone.
        output: 'mutating: data becomes [1, 2, 3]

          pure:     data stays [3, 1, 2]'
  - slug: macro-mixin-misuse
    cwes:
    - id: CWE-783
      name: Operator Precedence Logic Error
      url: https://cwe.mitre.org/data/definitions/783.html
    - id: CWE-682
      name: Incorrect Calculation
      url: https://cwe.mitre.org/data/definitions/682.html
    name: Macro & Mixin Misuse
    tagline: code that rewrites code, out of sight
    essence: Metaprogramming expands or mixes behavior the reader never sees.
    description: Textual macros and order-dependent mixins inject behavior at a distance, so what runs
      is not what the call site appears to say.
    examples:
    - title: Unhygienic Macros
      intent: A textual macro substitutes without parentheses or types, so it expands into something you
        did not write.
      languages:
      - name: C
        slug: c
        code: '/* SMELL: function-like macro with unguarded args */

          #define SQUARE(x) x * x

          SQUARE(1 + 2)        /* expands to 1 + 2 * 1 + 2 = 5, not 9 */


          /* SMELL: argument evaluated twice */

          #define MAX(a, b) ((a) > (b) ? (a) : (b))

          MAX(i++, j++)        /* increments the winner twice */


          /* RIGHT: a real (inline) function -- typed, one evaluation */

          static inline int square(int x) { return x * x; }'
        explanation: Macros are textual substitution with no type checking and no scope. An inline function
          gives the same speed with none of the traps.
        output: 'macro: SQUARE(1+2) = 5  (surprise)

          func:  square(1+2) = 9'
      - name: JavaScript
        slug: javascript
        code: "// SMELL: a mixin that mutates the target's state\nconst Timestamped = (obj) => Object.assign(obj,\
          \ {\n  touched: Date.now(),         // impure + shared mutation\n});\n\n// RIGHT: compose explicitly,\
          \ keep data and behavior apart\nconst withTimestamp = (obj, now) => ({ ...obj, touched: now\
          \ });"
        explanation: Object.assign mutates its target and the impure Date.now() hides inside the mixin.
          Composition keeps state explicit.
        output: 'mixin: original object is mutated; time hidden inside

          pure:  caller supplies `now`; original untouched'
    - title: Clobbered by Mixin Order
      intent: Two mixins define the same member, so which one wins depends only on the order they were
        applied.
      languages:
      - name: JavaScript
        slug: javascript
        code: 'const Serializable = { save() { return "json"; } };

          const Auditable    = { save() { return "audit-log"; } };


          // SMELL: last mixin silently wins; the other save() vanishes

          const model = Object.assign({}, Serializable, Auditable);

          model.save();          // "audit-log" -- did you mean to lose json?


          // RIGHT: name the behaviors; never let them collide

          const model = { saveJson: Serializable.save, audit: Auditable.save };'
        explanation: Object.assign copies left to right, so a later mixin overwrites an earlier method
          with no warning.
        output: 'mixed:  save() -> ''audit-log'' (json lost)

          explicit: saveJson() and audit() both reachable'
      - name: Python
        slug: python
        code: "# SMELL: cooperative methods clobber unless each calls super()\nclass A:        # mixin\n\
          \    def setup(self): self.log = [\"A\"]\nclass B:        # mixin\n    def setup(self): self.log\
          \ = [\"B\"]\nclass W(A, B):  # MRO is A, B -- B.setup never runs\n    pass\nW().setup()    \
          \          # log == ['A']\n\n# RIGHT: cooperate via super() so every mixin contributes\nclass\
          \ A:\n    def setup(self): super().setup(); self.log.append(\"A\")"
        explanation: Python's MRO picks the first matching method; without super() chaining, later mixins
          are silently skipped.
        output: 'naive: log == [''A'']  (B skipped)

          super: log == [''B'', ''A'']  (both run)'
  - slug: increment-decrement-operators
    cwes:
    - id: CWE-190
      name: Integer Overflow or Wraparound
      url: https://cwe.mitre.org/data/definitions/190.html
    - id: CWE-191
      name: Integer Underflow (Wrap or Wraparound)
      url: https://cwe.mitre.org/data/definitions/191.html
    - id: CWE-680
      name: Integer Overflow to Buffer Overflow
      url: https://cwe.mitre.org/data/definitions/680.html
    - id: CWE-758
      name: Reliance on Undefined, Unspecified, or Implementation-Defined Behavior
      url: https://cwe.mitre.org/data/definitions/758.html
    - id: CWE-193
      name: Off-by-one Error
      url: https://cwe.mitre.org/data/definitions/193.html
    name: ++ / -- & Integer Overflow
    tagline: bump a number past the edge and it wraps
    essence: Pre- versus post-increment hides off-by-one and double-counting; bump a fixed-width integer
      past its max and it silently wraps to the bottom.
    description: 'The ++ and -- operators fold a read, a write, and a value into one token — and the value
      they hand back is not always the one you expect. Push a bounded integer one step too far and it
      doesn''t overflow upward, it wraps: MAX + 1 becomes MIN, and a wrapped length or index can chain
      straight into a buffer overflow.'
    examples:
    - title: Pre- vs Post-Increment
      intent: i++ yields the old value and ++i the new one, so using the result inline changes what gets
        stored.
      languages:
      - name: Java
        slug: java
        code: 'int i = 0;


          // SMELL: post-increment returns the OLD value

          int a = i++;        // a = 0, i = 1


          // the classic self-assignment trap: i never advances

          i = i++;            // i is STILL 0 (old value written back)


          // RIGHT: ++i returns the new value; or just be explicit

          int b = ++i;        // b = 2, i = 2

          i += 1;             // unambiguous'
        explanation: i = i++ evaluates i++ to the old value, bumps i, then overwrites it with the saved
          old value. The increment is lost.
        output: 'i++  -> a = 0, i = 1

          i = i++ -> i = 0  (no change!)

          ++i  -> b = 2'
      - name: JavaScript
        slug: javascript
        code: 'const arr = [];

          let i = 0;


          // SMELL: post-increment indexes with the OLD value

          arr[i++] = "a";     // writes index 0, then i = 1

          arr[i++] = "b";     // writes index 1, then i = 2


          // reading inline is where it bites

          let n = 0;

          console.log(n++ + " then " + n);   // "0 then 1"


          // RIGHT: separate the bump from the use

          arr.push("a", "b");'
        explanation: Post-increment is fine when the bump stands alone, but combining it with the value
          it returns hides an off-by-one.
        output: 'arr = [''a'', ''b'']

          log: ''0 then 1'''
    - title: Undefined Evaluation Order
      intent: Mutating the same variable twice in one expression has no defined order in C — it is undefined
        behavior.
      languages:
      - name: C
        slug: c
        code: 'int i = 0;

          int a[4];


          /* UNDEFINED BEHAVIOR: i read & written with no sequence point */

          a[i] = i++;          /* which index? the standard does not say */

          int x = i++ + ++i;   /* result is not portable -- anything goes */


          /* RIGHT: one mutation per statement, ordered explicitly */

          a[i] = 0;

          i++;'
        explanation: Between sequence points C lets the compiler order sub-expressions freely. Two updates
          to i in one expression is UB, not just unclear.
        output: 'UB: result varies by compiler / flags

          right: deterministic, one step at a time'
      - name: Python
        slug: python
        code: '# Python has no ++ on purpose -- the antidote by design

          i = 0

          # i++            # SyntaxError


          i += 1            # one explicit, atomic step


          # +1 in a comprehension stays a value, never a hidden write

          nums = [n + 1 for n in range(4)]   # [1, 2, 3, 4]'
        explanation: By omitting ++/--, Python forces the read-modify-write to be a visible statement,
          sidestepping the whole class of bugs.
        output: 'i += 1 -> i = 1

          nums   -> [1, 2, 3, 4]'
    - title: Wraparound at the Boundary
      intent: A fixed-width integer has a ceiling; one bump past it wraps to the floor — and a wrapped
        size can become a buffer overflow.
      languages:
      - name: C
        slug: c
        code: '/* SMELL: unsigned wraps; signed overflow is undefined behavior */

          uint8_t x = 255;

          x++;                       /* x == 0, not 256 */


          /* CWE-680: an overflowed length feeds an allocation, then a copy */

          uint16_t len = a + b;      /* a + b > 65535 wraps to something tiny */

          char *buf = malloc(len);   /* too small */

          memcpy(buf, src, a + b);   /* writes past the buffer */


          /* RIGHT: check before you compute the size */

          if (a > UINT16_MAX - b) return -1;   /* would overflow */

          size_t n = (size_t)a + b;            /* widen, then allocate */'
        explanation: Wraparound turns a big number into a small one, so the allocation is sized from the
          wrapped value while the copy uses the real one. Widen the type and range-check before allocating.
        output: 'wrap:  len wraps small -> heap overflow on memcpy

          guard: oversize input rejected before malloc'
      - name: Java
        slug: java
        code: '// SMELL: int silently overflows -- no exception

          int max = Integer.MAX_VALUE;     // 2147483647

          int oops = max + 1;              // -2147483648  (wrapped to MIN)


          // the classic: a midpoint that goes negative on big arrays

          int mid = (low + high) / 2;      // low+high can overflow


          // RIGHT: fail loudly, or compute without overflowing

          int safe = Math.addExact(max, 1);   // throws ArithmeticException

          int m    = low + (high - low) / 2;  // never overflows'
        explanation: Java's int wraps on overflow instead of throwing, so a bad sum sails on as a negative.
          Math.addExact makes the overflow an exception; the (high - low) form avoids it entirely.
        output: 'wrap:    MAX + 1 -> MIN (no error)

          addExact: throws ArithmeticException'
      - name: Rust
        slug: rust
        code: "// Rust makes the choice explicit instead of guessing.\nlet x: u8 = 255;\n// let y = x\
          \ + 1;        // debug: panics; release: wraps to 0\n\n// Spell out which behavior you actually\
          \ want:\nlet wrapped = x.wrapping_add(1);     // 0, on purpose\nlet checked = x.checked_add(1);\
          \      // None -> you must handle it\nlet (v, of) = x.overflowing_add(1);  // (0, true) -- carry\
          \ flag\n\nmatch checked {\n    Some(n) => println!(\"{n}\"),\n    None    => eprintln!(\"would\
          \ overflow\"),\n}"
        explanation: 'A bare + can panic in debug and wrap in release, so Rust gives named operations:
          wrapping_, checked_, and overflowing_ each make the intent visible and reviewable.'
        output: 'checked_add: None -> handled by match

          wrapping_add: 0 (wrap chosen deliberately)'
  - slug: improper-initialization
    cwes:
    - id: CWE-665
      name: Improper Initialization
      url: https://cwe.mitre.org/data/definitions/665.html
    - id: CWE-457
      name: Use of Uninitialized Variable
      url: https://cwe.mitre.org/data/definitions/457.html
    - id: CWE-456
      name: Missing Initialization of a Variable
      url: https://cwe.mitre.org/data/definitions/456.html
    - id: CWE-908
      name: Use of Uninitialized Resource
      url: https://cwe.mitre.org/data/definitions/908.html
    - id: CWE-1188
      name: Insecure Default Initialization of Resource
      url: https://cwe.mitre.org/data/definitions/1188.html
    name: Improper Initialization
    tagline: read before it was ever written
    essence: 'The first state transition — undefined to defined — is the purest mutated-state bug: use
      a value before it exists and every later read inherits garbage.'
    description: 'A binding read before it is assigned, a field a constructor forgot, a resource left
      at its default: the undefined → defined transition is where state begins, and skipping it makes
      illegal states representable from the very first line.'
    examples:
    - title: Used Before Assigned
      intent: A variable or field read before anything wrote to it hands back whatever was already there.
      languages:
      - name: C
        slug: c
        code: "// SMELL: local is never initialized -- reads indeterminate memory\nint total() {\n   \
          \ int sum;                 // garbage value\n    for (int i = 0; i < 10; i++)\n        sum +=\
          \ i;            // adds to garbage; result is nonsense\n    return sum;\n}\n\n// RIGHT: initialize\
          \ at the point of declaration\nint total() {\n    int sum = 0;             // a defined starting\
          \ state\n    for (int i = 0; i < 10; i++)\n        sum += i;\n    return sum;\n}"
        explanation: An uninitialized automatic variable holds whatever bytes were on the stack. Reading
          it is undefined behavior; initialize at declaration so the starting state is real.
        output: 'uninit: sum += i over garbage -> nonsense

          init:   sum starts at 0 -> 45'
      - name: Go
        slug: go
        code: '// SMELL: the zero value of a map is nil, and writing to nil panics

          var counts map[string]int          // nil, not empty

          counts["a"]++                      // panic: assignment to entry in nil map


          // RIGHT: make() gives a real, writable map

          counts := make(map[string]int)     // initialized

          counts["a"]++                      // 1


          // (reading a nil map is fine -- it''s the WRITE that needs init)'
        explanation: Go zero-values everything, but a map's zero value is nil and only readable. You must
          make() it before writing, or the first assignment panics.
        output: 'nil map:  counts["a"]++ -> panic

          made map: counts["a"]++ -> 1'
    - title: Insecure Default Initialization
      intent: A field left at a permissive default — or a constructor that skips it — is a security hole,
        not just a bug.
      languages:
      - name: Python
        slug: python
        code: "class Session:\n    def __init__(self, user):\n        self.user = user\n        # SMELL:\
          \ is_admin never set; some paths read it -> AttributeError,\n        # or a __getattr__ shim\
          \ quietly returns a truthy default\n    def can_delete(self):\n        return self.is_admin\
          \          # AttributeError, or worse: True\n\n# RIGHT: initialize every field to a safe, explicit\
          \ default\nclass Session:\n    def __init__(self, user):\n        self.user = user\n       \
          \ self.is_admin = False         # deny by default"
        explanation: A field the constructor forgets is either a crash or, with a permissive fallback,
          an open door. Initialize every field — and make the default the safe one.
        output: 'missing: self.is_admin -> AttributeError / unsafe

          default: is_admin = False -> deny by default'
      - name: JavaScript
        slug: javascript
        code: "// SMELL: a half-built object escapes before it's fully set up\nfunction makeUser(req)\
          \ {\n  const u = {};\n  u.name = req.name;\n  save(u);                 // saved with role ===\
          \ undefined\n  u.role = \"member\";       // too late -- the saved copy is broken\n  return\
          \ u;\n}\n\n// RIGHT: build the whole value, then let it escape\nfunction makeUser(req) {\n \
          \ return { name: req.name, role: \"member\" };   // fully initialized\n}"
        explanation: Letting a partially-initialized object escape (saved, passed, returned) exposes the
          undefined window. Construct the complete value first, then release it.
        output: 'leaked: save() sees role === undefined

          whole:  object is complete before it escapes'
- id: unstructured-state
  cwe_pillar:
    id: CWE-707
    name: Improper Neutralization
    url: https://cwe.mitre.org/data/definitions/707.html
  name: Bugs of Unstructured State
  short_name: Unstructured
  category: unstructured
  tagline: consuming unknown input as state
  color_primary: 3D85C6
  color_secondary: 6FA8DC
  color_deep: 0B5394
  description: Bugs caused by consuming unknown or inadequately validated input as state, without type
    checking or structural contracts.
  essence: Data without shape, type, or contract; the mismatch cascades downstream.
  symptoms:
  - Information doesn't fit its expected container
  - Latent, lingering bugs even with more tests
  - Poor big-O performance with respect to input size
  - The problem moves around or persists
  causes:
  - divide by zero
  - type errors
  - index out of bounds
  - lack of input validation
  - unconstrained inputs
  - goto statements
  - duck typing without contracts
  - missing / undefined returns
  - version & library mismanagement
  - insecure deserialization
  tools_hurt:
  - dynamic & duck types
  - lack of validation
  - garbage in, garbage out
  - Any typing
  - nullability without handling
  - mixed types in collections
  - unbounded shapes & sizes
  - eval() or parse()
  philosophies:
  - name: The Art of Data Contract Design
    url: https://martinfowler.com/articles/consumerDrivenContracts.html
  - name: Railway Oriented Programming
    url: https://fsharpforfunandprofit.com/rop/
  - name: 'Refactoring Guru: State'
    url: https://refactoring.guru/design-patterns/state
  - name: Parse, don't validate
    url: https://lexi-lambda.github.io/blog/2019/11/05/parse-don-t-validate/
  two_hard_note: null
  pullquote:
    tag: control flow
    heading: goto was the original unstructured state
    text: The go to statement as it stands is just too primitive; it is too much an invitation to make
      a mess of one's program. The quality of programmers is a decreasing function of the density of go
      to statements in the code they produce.
    attribution: Edsger W. Dijkstra, “Go To Statement Considered Harmful” (1968)
  rules:
    title: Input Validation Rules of Thumb
    groups:
    - verb: Reading
      expect: Read values are correct, up-to-date, and trustworthy — until you have validated their structure
        and type, assume none of that is true.
    - verb: Writing
      expect: Written values are structured correctly, atomic, consistent, idempotent, and durable. Falsey
        and NULL values are handled safely, not by accident.
    - verb: Executing
      expect: An executed value is code, and code for the correct interpreter — and it can be interpreted
        correctly. (Wait, why are we executing input again?)
  case_study:
    title: Knight Capital Group
    meta: August 1, 2012 · 45 minutes · $440 million
    body: A new deployment landed on old hardware still configured to run repurposed, retired code. A
      technician had missed one node in the cluster when installing the new trading software. For 45 minutes
      the cluster sent the firm millions of unintended orders before anyone could pull the deployment.
    points:
    - System miscommunication snowballed into destruction
    - Reused data structures meant a dead flag now triggered live trades
    - No input validation on the orders being fired
    - No architectural discipline to stop a partial deploy
    kicker: Fintech at scale means no backsies.
    link: https://en.wikipedia.org/wiki/Knight_Capital_Group#2012_stock_trading_disruption
  defects:
  - slug: divide-by-zero
    cwes:
    - id: CWE-369
      name: Divide By Zero
      url: https://cwe.mitre.org/data/definitions/369.html
    - id: CWE-682
      name: Incorrect Calculation
      url: https://cwe.mitre.org/data/definitions/682.html
    name: Divide by Zero
    tagline: an unconstrained denominator
    essence: Nothing stops the divisor from being zero until the program meets it.
    description: A division is a promise that the denominator is non-zero, and the type system rarely
      keeps that promise. Integer division throws, floats quietly yield Infinity or NaN, and either way
      an unvalidated input poisons everything downstream.
    examples:
    - title: Ohm's Law, Unguarded
      intent: 'Ohm''s law rearranged: I = V / R. Nothing stops R from being zero until the program meets
        it.'
      languages:
      - name: Python
        slug: python
        code: "# V = I * R  ->  I = V / R\ndef current(voltage, resistance):\n    return voltage / resistance\
          \        # boom when resistance == 0\n\n# RIGHT: make the impossible value unrepresentable\n\
          def current(voltage, resistance):\n    if resistance == 0:\n        raise ValueError(\"resistance\
          \ must be non-zero\")\n    return voltage / resistance"
        explanation: The denominator is unconstrained input. Validate it at the boundary instead of trusting
          the caller.
        output: 'current(5, 0) -> ZeroDivisionError

          guarded     -> ValueError(''resistance must be non-zero'')'
      - name: JavaScript
        slug: javascript
        code: "// JS won't throw -- it returns Infinity or NaN, which spreads\n5 / 0;        // Infinity\n\
          0 / 0;        // NaN\n[Infinity].map(x => x * 2);   // [Infinity], silently wrong\n\n// RIGHT:\
          \ validate, return a Result-like value\nconst current = (v, r) =>\n  r === 0 ? { ok: false,\
          \ error: \"r is zero\" } : { ok: true, value: v / r };"
        explanation: 'Worse than a crash: JS yields Infinity/NaN that quietly poison every later calculation.'
        output: '5/0 -> Infinity (no error)

          current(5,0) -> { ok: false, error: ''r is zero'' }'
      - name: Rust
        slug: rust
        code: "// Integer divide by zero PANICS; float gives inf/NaN.\n// Rust pushes you to encode the\
          \ failure in the type.\nfn current(v: f64, r: f64) -> Result<f64, &'static str> {\n    if r\
          \ == 0.0 { return Err(\"resistance is zero\"); }\n    Ok(v / r)\n}\n\nmatch current(5.0, 0.0)\
          \ {\n    Ok(i)  => println!(\"{i} A\"),\n    Err(e) => eprintln!(\"rejected: {e}\"),\n}"
        explanation: Result<T, E> makes the caller acknowledge the failure path. The unhappy case cannot
          be forgotten.
        output: 'current(5.0, 0.0) -> Err("resistance is zero")

          handled by match, never ignored'
    - title: Averages Over an Empty Collection
      intent: Every average divides by a count, and the count is zero exactly when you forgot to check.
      languages:
      - name: Python
        slug: python
        code: "def average(scores):\n    return sum(scores) / len(scores)   # ZeroDivisionError on []\n\
          \n# RIGHT: define the empty case before you divide\ndef average(scores):\n    if not scores:\n\
          \        return None                    # or 0.0, but say so on purpose\n    return sum(scores)\
          \ / len(scores)"
        explanation: An empty list is a perfectly valid input; the division is what's invalid. Decide
          what 'the average of nothing' means at the boundary.
        output: 'average([]) -> ZeroDivisionError

          guarded   -> None'
      - name: JavaScript
        slug: javascript
        code: "const mean = xs => xs.reduce((a, b) => a + b, 0) / xs.length;\nmean([]);            //\
          \ NaN -- and NaN spreads silently\n\n// RIGHT: handle the empty case, return a Result-like value\n\
          const mean = xs =>\n  xs.length === 0\n    ? { ok: false }\n    : { ok: true, value: xs.reduce((a,\
          \ b) => a + b, 0) / xs.length };"
        explanation: JS won't throw; it returns NaN, which compares false against everything and quietly
          corrupts charts, sums, and thresholds.
        output: 'mean([]) -> NaN (no error)

          guarded  -> { ok: false }'
  - slug: type-errors
    cwes:
    - id: CWE-843
      name: Access of Resource Using Incompatible Type ('Type Confusion')
      url: https://cwe.mitre.org/data/definitions/843.html
    - id: CWE-704
      name: Incorrect Type Conversion or Cast
      url: https://cwe.mitre.org/data/definitions/704.html
    - id: CWE-476
      name: NULL Pointer Dereference
      url: https://cwe.mitre.org/data/definitions/476.html
    name: Type Errors in Dynamic Languages
    tagline: values that shape-shift under you
    essence: A value's type is assumed, never checked, until an operator means something you didn't write.
    description: Dynamic languages let any value flow anywhere; coercion and overloading turn + into concatenation
      and comparison into surprise. The mismatch hides until a specific input reaches a specific line.
    examples:
    - title: Coercion Makes + Ambiguous
      intent: Values shape-shift through coercion, so a + b means something different than you wrote.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// Coercion makes + ambiguous

          1 + "1";        // "11"  (string concat)

          "1" - 1;        // 0     (numeric subtraction)

          [] + {};        // "[object Object]"

          [] == ![];      // true  (the famous one)


          // RIGHT: parse at the edge, then trust your types

          const n = Number(input);

          if (Number.isNaN(n)) throw new Error("not a number");'
        explanation: + is overloaded for strings and numbers; the engine guesses. Parse input into a known
          type once, at the boundary.
        output: '1 + ''1'' = ''11''

          ''1'' - 1 = 0

          parsed:  Number(''1'') = 1 (validated)'
      - name: Python
        slug: python
        code: "# Mixed types compare and concatenate unpredictably\n\"3\" * 3          # '333', not 9\n\
          sorted([1, \"2\", 3])   # TypeError at runtime, deep in a loop\n\n# RIGHT: type hints + a runtime\
          \ guard at the edge\ndef area(w: float, h: float) -> float:\n    w, h = float(w), float(h) \
          \    # coerce once, deliberately\n    return w * h"
        explanation: Duck typing hides the mismatch until a specific input reaches a specific line. Coerce
          explicitly at the entry point.
        output: '''3'' * 3 = ''333''

          sorted([1,''2'',3]) -> TypeError

          area(''2'',''3'') = 6.0 (coerced)'
      - name: Ruby
        slug: ruby
        code: '# nil quietly threads through everything

          user = {name: "Pam"}

          user[:age] + 1        # NoMethodError: undefined `+'' for nil


          # RIGHT: fetch with a default, or fail loudly on purpose

          age = user.fetch(:age, 0)

          age = user.fetch(:age) { raise "age is required" }'
        explanation: '[] returns nil for a missing key; the error surfaces far from the cause. fetch forces
          a decision about absence.'
        output: 'user[:age] + 1 -> NoMethodError on nil

          user.fetch(:age, 0) + 1 -> 1'
      - name: Bash
        slug: bash
        code: '# Unquoted, unset variables are the wild west

          rm -rf $DIR/         # if DIR is empty: rm -rf /


          # RIGHT: fail on unset vars, quote everything

          set -euo nounset

          : "${DIR:?DIR must be set}"

          rm -rf "${DIR:?}/"   '
        explanation: An empty variable expands to nothing, turning a cleanup into a catastrophe. nounset
          and quoting are non-negotiable.
        output: 'unset DIR: rm -rf / (disaster)

          nounset:   ''DIR must be set'' -> script aborts'
    - title: Truthiness Is Not Absence
      intent: Falsy values are not the same as missing values, but if (x) treats them identically.
      languages:
      - name: JavaScript
        slug: javascript
        code: "// 0, \"\", NaN, null, undefined are ALL falsy\nfunction setQuantity(q) {\n  if (!q) q\
          \ = 1;       // BUG: a real order of 0 becomes 1\n  return q;\n}\n\n// RIGHT: test for absence,\
          \ not falsiness\nfunction setQuantity(q) {\n  return q ?? 1;       // only null / undefined\
          \ fall through\n}"
        explanation: '!q lumps a legitimate 0 in with null. The nullish coalescing operator distinguishes
          ''absent'' from ''zero''.'
        output: 'setQuantity(0)  -> 1   (wrong)

          q ?? 1 for 0    -> 0   (right)'
      - name: Python
        slug: python
        code: "def page_size(n):\n    return n or 50        # BUG: page_size(0) -> 50\n\n# RIGHT: be explicit\
          \ about None vs a falsy-but-valid value\ndef page_size(n):\n    return 50 if n is None else\
          \ n"
        explanation: n or 50 fires for 0, [], and '' too. 'is None' asks the question you actually meant.
        output: 'page_size(0) -> 50  (wrong)

          is None form -> 0  (right)'
  - slug: index-out-of-bounds
    cwes:
    - id: CWE-125
      name: Out-of-bounds Read
      url: https://cwe.mitre.org/data/definitions/125.html
    - id: CWE-787
      name: Out-of-bounds Write
      url: https://cwe.mitre.org/data/definitions/787.html
    - id: CWE-129
      name: Improper Validation of Array Index
      url: https://cwe.mitre.org/data/definitions/129.html
    name: Index Out of Bounds & Missing Keys
    tagline: reaching for something that isn't there
    essence: An index or key is assumed present; the structure never promised it.
    description: Arrays, dictionaries, and parsed payloads get reached into positionally, on faith. The
      slot is empty, the key absent, the array shorter than assumed, and the access fails far from the
      bad assumption.
    examples:
    - title: The Missing Key
      intent: Reaching into a structure for something that isn't there — a key, an array slot, a JSON
        field.
      languages:
      - name: Python
        slug: python
        code: "ages = {'Jim': 30, 'Pam': 28, 'Kevin': 33}\n\n# WRONG: assumes the key exists\nages['Michael']\
          \                 # KeyError: 'Michael'\n\n# RIGHT: ask for it safely, or validate the shape\
          \ first\nages.get('Michael', None)       # None\nif 'Michael' in ages:\n    use(ages['Michael'])"
        explanation: A literal lookup assumes a shape the data never promised. .get() turns a crash into
          a value you can handle.
        output: 'ages[''Michael''] -> KeyError

          ages.get(''Michael'') -> None'
      - name: JavaScript
        slug: javascript
        code: '// A real one: trusting the shape of an SNS event

          const msg = JSON.parse(event.Records[0].Sns.Message);

          // throws if Records is empty, or Sns is missing, or...


          // RIGHT: optional chaining + validate before parse

          const raw = event?.Records?.[0]?.Sns?.Message;

          if (typeof raw !== "string") throw new Error("bad event shape");

          const msg = JSON.parse(raw);'
        explanation: Each dot and index is an assumption about a payload you didn't build. Optional chaining
          plus a type check makes the contract explicit.
        output: 'unchecked: TypeError: Cannot read ''0'' of undefined

          checked:   throws ''bad event shape'' with context'
      - name: Ruby
        slug: ruby
        code: "# Brittle parsing chained on positional assumptions\nvalid = href_attrs.length == 2 &&\n\
          \        href_attrs[0] == 'href' &&\n        href_attrs[1].start_with?('\"')   # NoMethodError\
          \ if [1] is nil\n\n# RIGHT: guard each assumption, or parse with a real library\nvalid = href_attrs.length\
          \ == 2 &&\n        href_attrs[0] == 'href' &&\n        href_attrs[1].to_s.start_with?('\"')"
        explanation: Index 1 is assumed present and assumed a String. .to_s makes the type safe; a real
          HTML parser makes the whole thing safe.
        output: 'raw:      NoMethodError on nil[1]

          to_s:     false (no crash)'
    - title: The Empty-Collection Edge
      intent: first(), last(), and [0] all assume the collection has a first element.
      languages:
      - name: Python
        slug: python
        code: "def latest(events):\n    return events[-1]              # IndexError on []\n\n# RIGHT:\
          \ handle empty, or use a safe accessor\ndef latest(events):\n    return events[-1] if events\
          \ else None"
        explanation: Negative indexing doesn't wrap to safety; [-1] on an empty list throws just like
          [0] does.
        output: 'latest([]) -> IndexError

          guarded    -> None'
      - name: Java
        slug: java
        code: '// WRONG: assumes the stream produced something

          String first = names.stream().findFirst().get();   // NoSuchElementException


          // RIGHT: Optional forces you to handle the empty case

          String first = names.stream().findFirst().orElse("(none)");'
        explanation: Optional.get() on an empty Optional throws. orElse / orElseThrow make the empty path
          a decision, not an accident.
        output: 'get() on empty   -> NoSuchElementException

          orElse fallback  -> "(none)"'
  - slug: lack-of-input-validation
    cwes:
    - id: CWE-20
      name: Improper Input Validation
      url: https://cwe.mitre.org/data/definitions/20.html
    - id: CWE-89
      name: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')
      url: https://cwe.mitre.org/data/definitions/89.html
    - id: CWE-1284
      name: Improper Validation of Specified Quantity in Input
      url: https://cwe.mitre.org/data/definitions/1284.html
    name: Lack of Input Validation
    tagline: trusting data you did not create
    essence: Read values are assumed correct, written values assumed safe, executed values assumed benign
      — until proven otherwise.
    description: 'The Input Validation Rules of Thumb in one defect: reading expects trustworthy data,
      writing expects well-formed data, executing expects code for the right interpreter. Skip the check
      at the boundary and the whole program inherits the lie.'
    examples:
    - title: Executing Unvalidated Input
      intent: An executed value is code, and unvalidated input becomes code for the wrong interpreter.
      languages:
      - name: Python
        slug: python
        code: '# WRONG: user input concatenated straight into SQL

          cur.execute("SELECT * FROM users WHERE name = ''" + name + "''")

          # name = "x''; DROP TABLE users; --"  ->  catastrophe


          # RIGHT: parameterize -- the driver keeps data as data

          cur.execute("SELECT * FROM users WHERE name = %s", (name,))'
        explanation: String-building SQL lets input cross from data into code. Parameters keep the interpreter
          from ever seeing input as syntax.
        output: 'concatenated:  input can rewrite the query

          parameterized: input is always a bound value'
      - name: Bash
        slug: bash
        code: "# WRONG: eval on anything a user can influence\nmode=$(cat /tmp/mode)\neval \"run_$mode\"\
          \                 # mode file is attacker-controlled\n\n# RIGHT: validate against an allow-list,\
          \ never eval input\ncase \"$(cat /tmp/mode)\" in\n  full|incremental) run_backup \"$mode\" ;;\n\
          \  *) echo \"unknown mode\" >&2; exit 1 ;;\nesac"
        explanation: eval turns text into commands. An allow-list of known-good values is the only safe
          way to branch on outside input.
        output: 'eval: arbitrary command execution

          case: only ''full'' or ''incremental'' accepted'
    - title: Reading an Untrusted Payload
      intent: Read values are assumed correct and up-to-date; assume nothing until you have validated
        the shape.
      languages:
      - name: TypeScript
        slug: typescript
        code: '// WRONG: cast the JSON and pray

          const user = JSON.parse(body) as User;   // a cast checks nothing

          sendEmail(user.email.toLowerCase());     // crashes if email is missing


          // RIGHT: parse, don''t validate -- a schema returns a typed value

          const user = UserSchema.parse(JSON.parse(body));  // throws on bad shape

          sendEmail(user.email.toLowerCase());'
        explanation: '''as User'' is a compile-time fiction; at runtime the data can be anything. A schema
          (zod, io-ts) verifies the shape and hands back a value you can trust.'
        output: 'cast:   TypeError: Cannot read ''toLowerCase'' of undefined

          schema: throws ''email: Required'' at the boundary'
      - name: Python
        slug: python
        code: "# WRONG: trust the inbound dict's keys and types\ndef handle(payload):\n    return charge(payload[\"\
          amount\"] * 100)   # KeyError / TypeError roulette\n\n# RIGHT: validate into a typed model at\
          \ the edge (pydantic)\nclass Order(BaseModel):\n    amount: condecimal(gt=0)\n\ndef handle(payload):\n\
          \    order = Order(**payload)        # raises ValidationError on bad input\n    return charge(order.amount\
          \ * 100)"
        explanation: Validating into a model turns a scattering of runtime errors into one clear failure
          at the door, with the type guaranteed afterward.
        output: 'raw:       KeyError(''amount'') deep in charge()

          validated: ValidationError(''amount: must be > 0'')'
  - slug: unconstrained-inputs
    cwes:
    - id: CWE-1333
      name: Inefficient Regular Expression Complexity
      url: https://cwe.mitre.org/data/definitions/1333.html
    - id: CWE-400
      name: Uncontrolled Resource Consumption
      url: https://cwe.mitre.org/data/definitions/400.html
    - id: CWE-190
      name: Integer Overflow or Wraparound
      url: https://cwe.mitre.org/data/definitions/190.html
    name: Unconstrained Inputs
    tagline: input with no bounds on size or range
    essence: Nothing limits how big, how long, or how extreme an input can be — so something downstream
      pays for it.
    description: Validation that checks type but not magnitude. An input with no upper bound on length,
      size, or value becomes unbounded memory, catastrophic backtracking, integer overflow, or a denial
      of service. Constrain the range, not just the shape.
    examples:
    - title: No Bound on Size
      intent: An input with no maximum length is a denial-of-service waiting for a big enough request.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// WRONG: a catastrophic-backtracking regex on unbounded input

          const re = /^(a+)+$/;

          re.test("aaaaaaaaaaaaaaaaaaaaaaaa!");   // hangs the event loop (ReDoS)


          // RIGHT: bound the input first, then use a linear matcher

          if (input.length > 256) throw new Error("too long");

          const re = /^a+$/;'
        explanation: Nested quantifiers make match time exponential in input length. Capping length (and
          avoiding the pattern) keeps one request from freezing the server.
        output: 'unbounded: one request pins the CPU at 100%

          bounded:   rejected at 256 chars, linear match'
      - name: Python
        slug: python
        code: "# WRONG: read the whole upload into memory\ndata = request.body.read()           # a 10GB\
          \ POST is now 10GB of RAM\n\n# RIGHT: enforce a limit before you ever allocate\nMAX = 5 * 1024\
          \ * 1024\ndata = request.body.read(MAX + 1)\nif len(data) > MAX:\n    raise ValueError(\"payload\
          \ too large\")"
        explanation: An unconstrained read trusts the client to be reasonable. A hard cap turns a memory-exhaustion
          attack into a clean rejection.
        output: 'unbounded: OOM kill under a large upload

          bounded:   ''payload too large'' at 5MB'
    - title: No Bound on Range
      intent: A number that type-checks can still be negative, zero, or astronomically large.
      languages:
      - name: Python
        slug: python
        code: "# WRONG: limit is an int, so it must be fine... right?\ndef paginate(items, limit):\n \
          \   return items[:limit]          # limit=-1 silently drops the last row\n                 \
          \                 # limit=10**9 tries to slice everything\n\n# RIGHT: constrain the range at\
          \ the boundary\ndef paginate(items, limit):\n    limit = max(1, min(int(limit), 100))\n    return\
          \ items[:limit]"
        explanation: Type checking proved limit is an integer; it never proved limit is sane. Clamp to
          a valid range before use.
        output: 'limit=-1:  drops a row, no error

          clamped:   limit forced into 1..100'
      - name: Go
        slug: go
        code: "// WRONG: trust a count from the wire, then allocate it\nn := req.Count               \
          \  // int from an untrusted client\nbuf := make([]byte, n)         // n negative -> panic; n\
          \ huge -> OOM\n\n// RIGHT: validate the range before allocating\nif n < 0 || n > maxCount {\n\
          \    return fmt.Errorf(\"count out of range: %d\", n)\n}\nbuf := make([]byte, n)"
        explanation: make() with a hostile size panics or exhausts memory. A range check is the difference
          between a rejected request and a crashed process.
        output: 'unchecked: panic: makeslice: len out of range

          checked:   error(''count out of range: -1'')'
  - slug: duck-typing-without-contracts
    cwes:
    - id: CWE-843
      name: Access of Resource Using Incompatible Type ('Type Confusion')
      url: https://cwe.mitre.org/data/definitions/843.html
    - id: CWE-20
      name: Improper Input Validation
      url: https://cwe.mitre.org/data/definitions/20.html
    name: Duck Typing Without Contracts
    tagline: if it quacks — until it doesn't
    essence: A value is used as if it has a shape no one ever guaranteed it has.
    description: Duck typing is convenient until the duck is missing a method. Without an explicit contract
      — a protocol, an interface, an abstract base — 'it probably has .save()' is a runtime gamble that
      pays off until the one caller that passes something almost-compatible.
    examples:
    - title: The Duck That Couldn't
      intent: If it quacks like a duck, we assume it flies like one, and then it doesn't.
      languages:
      - name: Python
        slug: python
        code: "# Works for files, breaks for the StringIO someone passes later\ndef archive(f):\n    f.flush()\n\
          \    f.fileno()        # AttributeError: StringIO has no fileno()\n\n# The bug only appears\
          \ for inputs that are ALMOST file-like."
        explanation: Duck typing accepts anything until it reaches the one method the substitute lacks.
          The contract was implicit, so nothing flagged the mismatch.
        output: 'real file: ok

          StringIO:  AttributeError: ''fileno'''
      - name: Ruby
        slug: ruby
        code: "# reduce is assumed, so a non-enumerable blows up mid-iteration\ndef total(collection)\n\
          \  collection.reduce(0) { |sum, x| sum + x }   # NoMethodError if no #reduce\nend\n\ntotal(42)\
          \   # Integer has no #reduce -> crash far from the caller"
        explanation: Nothing declared that collection must be enumerable. The assumption surfaces as a
          NoMethodError deep inside the method.
        output: 'total([1,2,3]) -> 6

          total(42)      -> NoMethodError: reduce'
    - title: Give the Duck a Contract
      intent: An explicit protocol turns 'probably has the method' into a checkable guarantee.
      languages:
      - name: Python
        slug: python
        code: "from typing import Protocol\n\nclass Saveable(Protocol):\n    def save(self) -> None: ...\n\
          \ndef persist(item: Saveable) -> None:\n    item.save()            # type checker verifies item\
          \ has .save()\n\n# A type that lacks save() is now a mypy error, before runtime."
        explanation: typing.Protocol keeps duck typing's flexibility but makes the expected shape explicit
          and statically checkable.
        output: 'with .save():    type-checks, runs

          without .save(): mypy error before runtime'
      - name: Go
        slug: go
        code: "// An interface is a contract the compiler enforces structurally.\ntype Saver interface\
          \ { Save() error }\n\nfunc persist(s Saver) error {\n    return s.Save()        // anything\
          \ passed MUST implement Save()\n}\n\n// Passing a type without Save() simply won't compile."
        explanation: 'Go''s interfaces are duck typing checked at compile time: the shape is named, and
          conformance is verified before the program runs.'
        output: 'implements Saver: compiles

          missing Save():   compile error'
  - slug: missing-undefined-returns
    cwes:
    - id: CWE-252
      name: Unchecked Return Value
      url: https://cwe.mitre.org/data/definitions/252.html
    - id: CWE-394
      name: Unexpected Status Code or Return Value
      url: https://cwe.mitre.org/data/definitions/394.html
    - id: CWE-476
      name: NULL Pointer Dereference
      url: https://cwe.mitre.org/data/definitions/476.html
    name: Missing & Undefined Returns
    tagline: functions that quietly return nothing
    essence: A code path falls off the end, and 'nothing' silently becomes a value.
    description: Some path through the function never hits a return, or returns null / undefined / None,
      and the caller treats that absence as data. Strongly typed languages drag this from a downstream
      mystery to a compile-time error.
    examples:
    - title: The Same Bug, Solved by Types
      intent: Strongly typed languages move the unstructured-state failure from runtime to compile time,
        where it's cheap.
      languages:
      - name: TypeScript
        slug: typescript
        code: "// strictNullChecks turns a runtime crash into a red squiggle\ninterface User { name: string;\
          \ age?: number; }\n\nfunction birthday(u: User): number {\n  return u.age + 1;   // compile\
          \ error: 'u.age' is possibly undefined\n}\n\n// RIGHT: the compiler forces you to handle absence\n\
          function birthday(u: User): number {\n  return (u.age ?? 0) + 1;\n}"
        explanation: The optional field can't be used until you account for undefined. The bug never reaches
          production.
        output: 'without guard: TS2532 at compile time

          with ??:       compiles, handles missing age'
      - name: Go
        slug: go
        code: "// Errors are values you must thread through, not exceptions\nfunc current(v, r float64)\
          \ (float64, error) {\n    if r == 0 {\n        return 0, fmt.Errorf(\"resistance is zero\")\n\
          \    }\n    return v / r, nil\n}\n\ni, err := current(5, 0)\nif err != nil { return err }  \
          \ // the compiler nags if you ignore it"
        explanation: Returning (value, error) makes the failure path part of the signature. Linters flag
          an ignored err.
        output: 'current(5, 0) -> 0, error(''resistance is zero'')

          err is checked before i is used'
      - name: Kotlin
        slug: kotlin
        code: '// Nullability is in the type system: String vs String?

          fun greet(name: String) = "Hi, $name"


          val maybe: String? = lookup()

          greet(maybe)          // compile error: String? where String expected


          // RIGHT: the safe call / elvis operator handle the null

          greet(maybe ?: "stranger")'
        explanation: String and String? are different types. You cannot pass a nullable where a non-null
          is required without handling it.
        output: 'greet(maybe):       compile error

          greet(maybe ?: ...): ''Hi, stranger'''
      - name: Rust
        slug: rust
        code: "// Absence is Option<T>; you cannot forget to handle None.\nfn first_word(s: &str) -> Option<&str>\
          \ {\n    s.split_whitespace().next()\n}\n\nmatch first_word(\"\") {\n    Some(w) => println!(\"\
          {w}\"),\n    None    => println!(\"(empty input)\"),   // exhaustive\n}"
        explanation: Option<T> makes 'nothing' a value the type system tracks. The match must cover None
          or it won't compile.
        output: 'first_word("") -> None

          match is exhaustive: ''(empty input)'''
    - title: The Function That Forgets to Return
      intent: A branch with no return doesn't error; it hands back undefined / None and the caller runs
        with it.
      languages:
      - name: JavaScript
        slug: javascript
        code: "// BUG: the else path has no return -> undefined\nfunction discount(user) {\n  if (user.isMember)\
          \ return 0.1;\n  // forgot the non-member case\n}\nconst price = base * (1 - discount(guest));\
          \   // NaN: 1 - undefined\n\n// RIGHT: every path returns; lint with consistent-return\nfunction\
          \ discount(user) {\n  return user.isMember ? 0.1 : 0;\n}"
        explanation: 'A missing return is undefined, and arithmetic on undefined is NaN: a wrong number
          with no stack trace.'
        output: 'guest: 1 - undefined -> NaN

          fixed: 1 - 0 -> 1'
      - name: Python
        slug: python
        code: "# BUG: the loop may finish without returning -> implicit None\ndef find_admin(users):\n\
          \    for u in users:\n        if u.role == \"admin\":\n            return u\n    # no admin?\
          \ falls off the end -> None\n\nadmin = find_admin(users)\nadmin.notify()        # AttributeError:\
          \ 'NoneType' has no 'notify'\n\n# RIGHT: make the 'not found' case explicit\ndef find_admin(users):\n\
          \    return next((u for u in users if u.role == \"admin\"), None)"
        explanation: Python returns None when execution falls off the end. The caller crashes later, far
          from the function that 'forgot'.
        output: 'no admin: None -> AttributeError downstream

          explicit: caller checks for None first'
  - slug: version-library-mismanagement
    cwes:
    - id: CWE-1395
      name: Dependency on Vulnerable Third-Party Component
      url: https://cwe.mitre.org/data/definitions/1395.html
    - id: CWE-1104
      name: Use of Unmaintained Third Party Components
      url: https://cwe.mitre.org/data/definitions/1104.html
    - id: CWE-937
      name: Using Components with Known Vulnerabilities
      url: https://cwe.mitre.org/data/definitions/937.html
    name: Version & Library Mismanagement
    tagline: dependencies drifting out from under you
    essence: The code you tested and the code that ships resolve to different library versions.
    description: Floating version ranges, unpinned lockfiles, and copy-pasted helpers make the dependency
      tree itself unstructured input. A 'patch' bump changes behavior, two libraries demand incompatible
      versions, and 'works on my machine' becomes a deployment incident.
    examples:
    - title: The Caret That Shipped a Surprise
      intent: A floating range pulls a new version you never tested at build time.
      languages:
      - name: JSON
        slug: json
        code: "// package.json -- WRONG: ranges float on every install\n{\n  \"dependencies\": {\n   \
          \ \"date-utils\": \"^1.2.0\"\n  }\n}\n// ^1.2.0 allows any 1.x; a 1.3.0 with a regression slips\
          \ in silently.\n// RIGHT: commit package-lock.json and install with `npm ci`,\n// which installs\
          \ the locked tree verbatim."
        explanation: ^1.2.0 means 'any 1.x' -- a minor release with a behavior change installs silently.
          A committed lockfile plus npm ci makes installs reproducible.
        output: '^1.2.0: build A gets 1.2.0, build B gets 1.4.7

          npm ci: every build gets the locked version'
      - name: Python
        slug: python
        code: '# requirements.txt -- WRONG: unpinned, resolves differently over time

          requests

          urllib3


          # RIGHT: pin exact versions for reproducible installs

          requests==2.31.0

          urllib3==2.2.1'
        explanation: Unpinned requirements resolve to 'whatever is newest today'. Pinning makes the dependency
          set part of the code you reviewed.
        output: 'unpinned: prod pulls a newer, untested urllib3

          pinned:   prod matches the tested set exactly'
    - title: Copy-Pasta Drift
      intent: A helper copied into three services becomes three subtly different helpers.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// service-a: the original, later patched for a leap-year bug

          function daysInMonth(y, m) { /* ...fixed... */ }


          // service-b: a copy-paste from a year ago -- never got the fix

          function daysInMonth(y, m) { /* ...buggy in February... */ }


          // The ''same'' function now disagrees across services.'
        explanation: 'Copied code forks silently: a fix applied to one copy never reaches the others.
          The duplication is the version-mismanagement.'
        output: 'service-a: Feb 2024 -> 29 (fixed)

          service-b: Feb 2024 -> 28 (stale copy)'
      - name: JSON
        slug: json
        code: "// RIGHT: one source of truth, versioned as a real dependency\n{\n  \"dependencies\": {\n\
          \    \"@acme/dates\": \"1.4.0\"\n  }\n}\n// One place to fix, one version to bump everywhere."
        explanation: Extracting the helper into a versioned package replaces N drifting copies with one
          dependency every consumer pins.
        output: 'copies:  N forks, fixes diverge

          package: one fix, bump the version everywhere'
  - slug: insecure-deserialization
    cwes:
    - id: CWE-502
      name: Deserialization of Untrusted Data
      url: https://cwe.mitre.org/data/definitions/502.html
    - id: CWE-915
      name: Improperly Controlled Modification of Dynamically-Determined Object Attributes
      url: https://cwe.mitre.org/data/definitions/915.html
    - id: CWE-913
      name: Improper Control of Dynamically-Managed Code Resources
      url: https://cwe.mitre.org/data/definitions/913.html
    - id: CWE-20
      name: Improper Input Validation
      url: https://cwe.mitre.org/data/definitions/20.html
    name: Insecure Deserialization
    tagline: untrusted bytes become live objects
    essence: Hydrating untrusted input straight into live objects runs code and sets state the caller
      never wrote.
    description: 'Deserialization is the purest form of consuming unknown input as state: bytes you did
      not create become objects with behavior. Native formats can execute code on the way in (chaining
      to RCE, CWE-94/78), and even ''safe'' formats over-assign attributes the caller never meant to expose.'
    examples:
    - title: Hydrating Untrusted Bytes
      intent: A native deserializer reconstructs objects — and can run their code — before any of your
        logic sees the data.
      languages:
      - name: Python
        slug: python
        code: "import pickle\n\n# DANGER: pickle reconstructs arbitrary objects -- and runs __reduce__\n\
          data = pickle.loads(untrusted_bytes)   # attacker payload = RCE\n\n# An attacker's class can\
          \ do this on load:\nclass Exploit:\n    def __reduce__(self):\n        return (os.system, (\"\
          rm -rf /\",))   # runs during loads()\n\n# RIGHT: a data-only format + an explicit schema\n\
          import json\nfrom pydantic import BaseModel\nclass Order(BaseModel): id: int; qty: int\norder\
          \ = Order(**json.loads(untrusted_bytes))   # validated, no code"
        explanation: pickle.loads will execute an object's __reduce__ as it rebuilds it, so loading attacker
          bytes is arbitrary code execution. Parse a data-only format and validate against a schema instead.
        output: 'pickle: __reduce__ runs -> shell command

          schema: bad shape -> ValidationError, no code'
      - name: Java
        slug: java
        code: '// DANGER: readObject rebuilds any serializable type on the classpath

          ObjectInputStream in = new ObjectInputStream(socket.getInputStream());

          Object o = in.readObject();        // gadget chains -> RCE


          // RIGHT: don''t deserialize untrusted native streams.

          // Use a data format with a known target type:

          ObjectMapper m = new ObjectMapper();

          m.activateDefaultTyping(...);      // <- do NOT; this re-opens the hole

          Order order = m.readValue(json, Order.class);   // fixed target type'
        explanation: Java's native readObject instantiates whatever the stream names, letting gadget chains
          reach dangerous code. Avoid native serialization for untrusted data; bind a known type from
          a data format.
        output: 'readObject: gadget chain -> code execution

          readValue:  bound to Order.class only'
    - title: Over-Permissive Hydration
      intent: Splatting raw input onto an object sets fields the caller never intended — like a privilege
        flag.
      languages:
      - name: Ruby
        slug: ruby
        code: '# WRONG: mass assignment trusts every key in the payload

          user = User.new(params)         # params has admin: true -> privilege escalation

          user.save


          # RIGHT: strong params -- an explicit allowlist of fields

          permitted = params.require(:user).permit(:name, :email)

          user = User.new(permitted)      # admin can''t be set from input'
        explanation: Handing the whole params hash to a model lets a caller set any attribute, including
          admin. An allowlist (strong params) makes the writable set explicit.
        output: 'mass assign: admin: true -> account escalated

          allowlist:   only name/email accepted'
      - name: JavaScript
        slug: javascript
        code: '// WRONG: copy every field from the request onto the record

          Object.assign(user, req.body);   // req.body.role = "admin" sticks

          await user.save();


          // RIGHT: pick only the fields you mean to accept

          const { name, email } = req.body;

          Object.assign(user, { name, email });   // role is untouched'
        explanation: Object.assign with raw req.body lets the client overwrite any property, including
          role. Destructure the known-safe fields and assign only those.
        output: 'assign body: role -> ''admin'' (overwritten)

          pick fields: role unchanged, name/email set'
- id: shared-state
  cwe_pillar:
    id: CWE-662
    name: Improper Synchronization
    url: https://cwe.mitre.org/data/definitions/662.html
  name: Bugs of Shared State
  short_name: Shared
  category: shared
  tagline: concurrency and caching of state
  color_primary: DD3333
  color_secondary: F87171
  color_deep: B91C1C
  description: Bugs caused by concurrency, caching, and the distribution of state across multiple independent
    actors or processes.
  essence: State changes may not be instantaneous, may not be everywhere, and may not be complete.
  symptoms:
  - Data is inaccessible or out of order
  - Resources are slow or unavailable
  - Information is wrong or outdated
  - Communications are being dropped
  - “Works on my machine”
  causes:
  - race conditions
  - resource contention
  - stack overflow bugs
  - async IO misuse
  - pointer mismanagement
  - cache invalidation
  - threading & mutexes
  - file or network access
  - limited hardware resources
  - resource leaks & shutdown
  tools_hurt:
  - threading / mutexes
  - high availability
  - replication and sharding
  - operations sloppiness
  - pass-by-reference
  - async mismanagement
  philosophies:
  - name: Dining Philosophers
    url: https://en.wikipedia.org/wiki/Dining_philosophers_problem
  - name: Fallacies of Distributed Computing
    url: https://en.wikipedia.org/wiki/Fallacies_of_distributed_computing
  - name: CAP Theorem
    url: https://en.wikipedia.org/wiki/CAP_theorem
  - name: DoD Memory Safety Report
    url: https://media.defense.gov/2022/Nov/10/2003112742/-1/-1/0/CSI_SOFTWARE_MEMORY_SAFETY.PDF
  two_hard_note: cache invalidation
  analogy_table:
    caption: Every shared-state problem has a human name. Computers just hit them faster.
    rows:
    - computer: Cache Invalidation
      human: Product Recalls
      note: A product is supplied from a distribution point; changing it means changing every distribution.
        Invalidation is business logic, a work order that takes a process and happens now.
    - computer: Resource Contention
      human: Tragedy of the Commons
      note: Independent actors each act in their own best interest and deplete a shared resource through
        uncoordinated allocation.
    - computer: Async Misuse
      human: Undeliverable Mail
      note: Messages in transit occupy space, and not every message sent over the network gets through.
        No message may be silently dropped.
  deadlock_table:
    caption: Two ways concurrency stalls. Both achieve nothing.
    rows:
    - name: Deadlock
      human: an impasse
      desc: Multiple actors wait on one another, each paused until an impossible condition is met. NOTHING
        IS HAPPENING. NOTHING IS ACHIEVED.
    - name: Livelock
      human: two people dodging in a hallway
      desc: Actors execute too early and keep reacting to each other; success is impossible unless someone
        waits. SO MUCH IS HAPPENING. NOTHING IS ACHIEVED.
  spectrum:
    caption: How far you are from the metal decides what a shared-state bug costs you.
    rows:
    - model: Interpreted
      langs: Python, JavaScript, Ruby
      trait: Runs inside an interpreter process. Runtime exceptions; the interpreter does its best to
        recover.
    - model: Compiled (VM)
      langs: Java, C#
      trait: Bytecode on a sandboxed virtual machine. Exceptions are handled by the VM; recovery is possible.
    - model: Executed (native)
      langs: C, Rust, Assembly
      trait: Architecture-specific machine code. No exceptions, only segfaults. Memory safety is the whole
        game.
  defects:
  - slug: race-conditions
    cwes:
    - id: CWE-362
      name: Concurrent Execution using Shared Resource with Improper Synchronization ('Race Condition')
      url: https://cwe.mitre.org/data/definitions/362.html
    - id: CWE-367
      name: Time-of-check Time-of-use (TOCTOU) Race Condition
      url: https://cwe.mitre.org/data/definitions/367.html
    - id: CWE-366
      name: Race Condition within a Thread
      url: https://cwe.mitre.org/data/definitions/366.html
    name: Race Conditions
    tagline: timing, not logic, picks the answer
    essence: When two actors touch one value at once, the interleaving decides the (wrong) result.
    description: Two threads read-modify-write the same state, and the order they happen to interleave
      — not your code — chooses what survives.
    examples:
    - title: Lost-Update Counter
      intent: Two actors read-modify-write the same value, and the interleaving loses updates.
      languages:
      - name: Python
        slug: python
        code: "import threading\ncounter = 0\n\ndef bump():\n    global counter\n    for _ in range(100_000):\n\
          \        counter += 1           # read, +1, write -- not atomic\n\n# Two threads race; final\
          \ value is < 200000\nt1, t2 = threading.Thread(target=bump), threading.Thread(target=bump)\n\
          \n# RIGHT: a lock makes the read-modify-write atomic\nlock = threading.Lock()\ndef bump_safe():\n\
          \    global counter\n    for _ in range(100_000):\n        with lock:\n            counter +=\
          \ 1"
        explanation: counter += 1 is three operations. Without a lock, two threads interleave and lose
          updates.
        output: 'racy:  counter = 137422  (lost updates)

          locked: counter = 200000  (correct)'
      - name: Go
        slug: go
        code: "// Detect races before they ship:  go test -race\nvar count int\nvar wg sync.WaitGroup\n\
          for i := 0; i < 1000; i++ {\n    wg.Add(1)\n    go func() { count++; wg.Done() }()   // -race\
          \ flags this\n}\n\n// RIGHT: a mutex, or a channel to serialize access\nvar mu sync.Mutex\n\
          go func() { mu.Lock(); count++; mu.Unlock(); wg.Done() }()"
        explanation: Go ships a race detector. Run it in CI and the data race fails the build instead
          of production.
        output: 'go test -race: WARNING: DATA RACE

          with mutex:    clean, deterministic'
      - name: Rust
        slug: rust
        code: '// Rust refuses to compile a data race. Shared + mutable

          // must go through a synchronizing type.

          use std::sync::{Arc, Mutex};

          use std::thread;


          let counter = Arc::new(Mutex::new(0));

          let c = Arc::clone(&counter);

          thread::spawn(move || { *c.lock().unwrap() += 1; });'
        explanation: The borrow checker enforces 'shared XOR mutable' at compile time. A data race is
          not expressible.
        output: 'raw shared &mut across threads: won''t compile

          Arc<Mutex<T>>: safe, checked statically'
    - title: Check-Then-Act (TOCTOU)
      intent: The gap between testing a condition and acting on it is where a second actor slips in.
      languages:
      - name: Java
        slug: java
        code: "// SMELL: check-then-act across threads\nif (instance == null) {        // thread A and\
          \ B both see null\n    instance = new Service();  // two instances created\n}\n\n// RIGHT: atomic\
          \ or properly synchronized init\nprivate static final AtomicReference<Service> ref = new AtomicReference<>();\n\
          ref.compareAndSet(null, new Service());"
        explanation: The gap between the check and the act is where the race lives. compareAndSet closes
          it atomically.
        output: 'naive:  two Service instances under load

          CAS:    exactly one wins, the rest reuse it'
      - name: Python
        slug: python
        code: "# SMELL: check-then-act on shared state\nif username not in users:        # two requests\
          \ both see it free\n    users[username] = create()   # both create -> duplicate user\n\n# RIGHT:\
          \ make the check-and-set one atomic step\nwith lock:                       # (or a DB unique\
          \ constraint)\n    if username not in users:\n        users[username] = create()"
        explanation: Reading 'is it free?' and writing 'claim it' must be one indivisible step, or two
          callers both win the check.
        output: 'unlocked: two duplicate accounts created

          locked:   one wins, the other sees it taken'
  - slug: resource-contention
    cwes:
    - id: CWE-400
      name: Uncontrolled Resource Consumption
      url: https://cwe.mitre.org/data/definitions/400.html
    - id: CWE-770
      name: Allocation of Resources Without Limits or Throttling
      url: https://cwe.mitre.org/data/definitions/770.html
    - id: CWE-833
      name: Deadlock
      url: https://cwe.mitre.org/data/definitions/833.html
    name: Resource Contention
    tagline: the tragedy of the commons
    essence: Independent actors each act in self-interest and exhaust a shared, finite resource.
    description: Connections, threads, file handles, memory — finite pools drained by uncoordinated allocation.
      The computer's tragedy of the commons.
    examples:
    - title: Connection-Pool Exhaustion
      intent: A resource grabbed and never returned drains the pool until every request hangs.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: a connection acquired and never returned to the pool\ndef handler(req):\n    conn\
          \ = pool.acquire()        # under load the pool drains to zero\n    rows = conn.query(req.sql)\
          \   # an exception here leaks the conn\n    return rows                  # ...and it is never\
          \ released\n\n# RIGHT: always return the resource, even on error\ndef handler(req):\n    with\
          \ pool.acquire() as conn:     # context manager releases on exit\n        return conn.query(req.sql)"
        explanation: Any early return or exception between acquire and release leaks the resource. A context
          manager makes release unconditional.
        output: 'leak: pool exhausted, every request blocks

          with: connection returned, throughput stable'
      - name: Java
        slug: java
        code: "// SMELL: close() skipped on the exception path\nConnection c = pool.getConnection();\n\
          Result r = c.query(sql);   // throws -> c is never closed\nc.close();\n\n// RIGHT: try-with-resources\
          \ closes c no matter what\ntry (Connection c = pool.getConnection()) {\n    return c.query(sql);\n\
          }"
        explanation: The manual close() runs only on the happy path. try-with-resources guarantees release
          on every path.
        output: 'manual close: leaked on every thrown query

          try-with:     released on success and failure'
    - title: Unbounded Concurrency
      intent: One worker per item looks elegant until a million items melt the machine.
      languages:
      - name: Go
        slug: go
        code: "// SMELL: one goroutine per item -> millions of goroutines, OOM\nfor _, job := range jobs\
          \ {\n    go process(job)              // nothing bounds the fan-out\n}\n\n// RIGHT: a buffered\
          \ channel caps concurrency\nsem := make(chan struct{}, 16)   // at most 16 in flight\nfor _,\
          \ job := range jobs {\n    sem <- struct{}{}\n    go func(j Job) { defer func() { <-sem }();\
          \ process(j) }(job)\n}"
        explanation: Unbounded fan-out treats the scheduler and memory as infinite. A semaphore bounds
          the commons to a fair, fixed width.
        output: 'unbounded: memory spikes, scheduler thrashes

          semaphore: steady 16-wide, predictable load'
      - name: Python
        slug: python
        code: "import asyncio\n\n# SMELL: launch every task at once -> thousands of open sockets\nawait\
          \ asyncio.gather(*(fetch(u) for u in urls))   # all 50k at once\n\n# RIGHT: a semaphore bounds\
          \ how many run concurrently\nsem = asyncio.Semaphore(20)\nasync def bounded(u):\n    async with\
          \ sem:\n        return await fetch(u)\nawait asyncio.gather(*(bounded(u) for u in urls))"
        explanation: gather schedules everything immediately. Wrapping each call in a semaphore caps the
          in-flight set to a sustainable size.
        output: 'unbounded: ''too many open files'', server 503s

          bounded:   20 at a time, steady and polite'
  - slug: stack-overflow
    cwes:
    - id: CWE-674
      name: Uncontrolled Recursion
      url: https://cwe.mitre.org/data/definitions/674.html
    - id: CWE-121
      name: Stack-based Buffer Overflow
      url: https://cwe.mitre.org/data/definitions/121.html
    - id: CWE-787
      name: Out-of-bounds Write
      url: https://cwe.mitre.org/data/definitions/787.html
    name: Stack Overflow Bugs
    tagline: recursion with no floor
    essence: A call stack that never unwinds, or a heap that never stops growing, runs out of room.
    description: Unbounded recursion exhausts the stack; runaway allocation exhausts the heap and the
      OOM killer steps in. Either way the program is reaped.
    examples:
    - title: Unbounded Recursion
      intent: No base case is reached, so the stack grows until it is gone.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: no base case reached (e.g. a cyclic list)\ndef depth(node):\n    return 1 + depth(node.next)\
          \   # recurses forever\n\n# RIGHT: iterate -- constant stack, any length\ndef depth(node):\n\
          \    n = 0\n    while node is not None:\n        n += 1\n        node = node.next\n    return\
          \ n"
        explanation: Python caps recursion at ~1000 frames and raises RecursionError. An explicit loop
          uses O(1) stack and handles any input.
        output: 'recursive: RecursionError at ~1000 frames

          iterative: returns, constant stack'
      - name: C
        slug: c
        code: "/* SMELL: deep recursion smashes the fixed-size stack */\nlong sum(long n) { return n ==\
          \ 0 ? 0 : n + sum(n - 1); }\nsum(10000000);   /* segfault: stack overflow, no exception */\n\
          \n/* RIGHT: a loop uses constant stack */\nlong sum(long n) {\n    long s = 0;\n    for (; n\
          \ > 0; n--) s += n;\n    return s;\n}"
        explanation: C does not check stack depth. Overflow is undefined behavior — usually a segfault,
          sometimes silent corruption.
        output: 'recursive: segmentation fault (stack overflow)

          iterative: returns, constant stack'
      - name: Java
        slug: java
        code: "// SMELL: recursion deeper than the thread stack\nint sum(int n) { return n == 0 ? 0 :\
          \ n + sum(n - 1); }\nsum(1_000_000);   // throws StackOverflowError\n\n// RIGHT: iterate\nint\
          \ sum(int n) {\n    int s = 0;\n    for (; n > 0; n--) s += n;\n    return s;\n}"
        explanation: The JVM turns overflow into a catchable StackOverflowError rather than a crash —
          but it is still a bug, not a recovery strategy.
        output: 'recursive: StackOverflowError

          iterative: returns, constant stack'
    - title: Runaway Allocation & the OOM Killer
      intent: Holding the whole dataset in memory invites the kernel to reap the process.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: materialize everything in RAM -> the OOM killer wins\nrows = [transform(r) for\
          \ r in db.fetch_all()]   # 50M rows at once\nreturn summarize(rows)\n\n# RIGHT: stream and process\
          \ in bounded chunks\ntotal = Summary()\nfor batch in db.iter_batches(size=10_000):\n    total.update(transform(r)\
          \ for r in batch)\nreturn total"
        explanation: fetch_all() loads the entire result set; memory scales with the data and the kernel
          kills the process. Streaming keeps memory bounded.
        output: 'all-in-RAM: Killed  (reaped by the OOM killer)

          streamed:  steady memory, completes'
  - slug: async-io-misuse
    cwes:
    - id: CWE-362
      name: Concurrent Execution using Shared Resource with Improper Synchronization ('Race Condition')
      url: https://cwe.mitre.org/data/definitions/362.html
    - id: CWE-662
      name: Improper Synchronization
      url: https://cwe.mitre.org/data/definitions/662.html
    - id: CWE-696
      name: Incorrect Behavior Order
      url: https://cwe.mitre.org/data/definitions/696.html
    name: Async IO Misuse
    tagline: messages sent, never delivered
    essence: Fire-and-forget work drops results and failures no one notices are gone.
    description: 'Floating promises, un-awaited tasks, and unhandled rejections: async work whose ordering
      and errors vanish. The computer''s undeliverable mail.'
    examples:
    - title: Floating Promises
      intent: Promises no one awaits run in undefined order and swallow their own errors.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// SMELL: floating promise -- errors vanish, order is undefined

          items.forEach(async (i) => { await save(i); });  // not awaited

          doNext();   // runs before any save() finishes


          // RIGHT: await the whole batch, surface failures

          const results = await Promise.allSettled(items.map(save));

          const failed = results.filter(r => r.status === "rejected");

          if (failed.length) throw new AggregateError(failed, "some saves failed");'
        explanation: forEach ignores the returned promises, so doNext() races ahead and rejections are
          swallowed. allSettled waits and reports.
        output: 'forEach: doNext() runs early; errors lost

          allSettled: waits for all; failures collected'
      - name: Python
        slug: python
        code: "import asyncio\n\n# SMELL: task created but never awaited -> may be GC'd mid-flight\nasync\
          \ def main():\n    asyncio.create_task(save(x))   # warning: never awaited\n    return\n\n#\
          \ RIGHT: gather and await, propagate exceptions\nasync def main():\n    await asyncio.gather(*(save(i)\
          \ for i in items))"
        explanation: An un-awaited task can be garbage-collected before it finishes. gather() keeps references
          and re-raises errors.
        output: 'create_task only: ''Task was destroyed but it is pending!''

          gather:           all complete or first error raised'
    - title: Awaiting in a Loop
      intent: Awaiting each call in turn serializes I/O that could have run concurrently.
      languages:
      - name: JavaScript
        slug: javascript
        code: "// SMELL: awaiting in a loop runs requests one at a time\nconst out = [];\nfor (const id\
          \ of ids) {\n  out.push(await fetchUser(id));   // N round-trips, strictly serial\n}\n\n// RIGHT:\
          \ start them together, await as a batch\nconst out = await Promise.all(ids.map(fetchUser));"
        explanation: Each await blocks the next iteration, so total time is the sum of every request.
          Promise.all overlaps them.
        output: 'serial:      ~1.2s for 20 ids

          Promise.all: ~60ms (bounded by the slowest)'
      - name: Python
        slug: python
        code: "# SMELL: awaiting inside the loop serializes the I/O\nresults = []\nfor uid in ids:\n \
          \   results.append(await fetch_user(uid))   # one at a time\n\n# RIGHT: schedule together, await\
          \ once\nresults = await asyncio.gather(*(fetch_user(u) for u in ids))"
        explanation: await suspends the coroutine until that one call returns before starting the next.
          gather lets them run at the same time.
        output: 'serial: sum of every request''s latency

          gather: bounded by the slowest single request'
  - slug: pointer-mismanagement
    cwes:
    - id: CWE-476
      name: NULL Pointer Dereference
      url: https://cwe.mitre.org/data/definitions/476.html
    - id: CWE-416
      name: Use After Free
      url: https://cwe.mitre.org/data/definitions/416.html
    - id: CWE-415
      name: Double Free
      url: https://cwe.mitre.org/data/definitions/415.html
    - id: CWE-787
      name: Out-of-bounds Write
      url: https://cwe.mitre.org/data/definitions/787.html
    name: Pointer Mismanagement
    tagline: dangling, double-freed, used-after-free
    essence: A pointer outlives what it points to, and the bytes start to lie.
    description: Use-after-free, double-free, and dangling references — roughly 70% of serious CVEs. The
      bugs the DoD wrote a memo about.
    examples:
    - title: Use-After-Free & Double-Free
      intent: Freed memory is still pointed at, then read, written, or freed a second time.
      languages:
      - name: C
        slug: c
        code: 'char *p = malloc(16);

          free(p);

          strcpy(p, "oops");   /* use-after-free: undefined behavior */

          free(p);             /* double-free: heap corruption */


          /* RIGHT: null after free, single owner, check allocations */

          free(p);

          p = NULL;            /* now a stray use is a clean NULL deref */'
        explanation: Roughly 70% of serious CVEs are memory-safety bugs like these. Nulling after free
          turns silent corruption into a loud crash.
        output: 'raw:    use-after-free -> exploitable corruption

          p=NULL: later use -> immediate, debuggable crash'
      - name: Rust
        slug: rust
        code: '// Ownership makes use-after-free a compile error.

          let s = String::from("hello");

          let moved = s;            // ownership moves out of `s`

          // println!("{s}");       // error: borrow of moved value `s`


          // Borrowing rules also separate owned String from borrowed &str

          fn len(text: &str) -> usize { text.len() }   // borrows, never frees'
        explanation: The compiler tracks who owns each value and frees it exactly once, at the end of
          scope. Use-after-free cannot be written.
        output: 'use-after-move: rejected at compile time

          borrow &str:    no ownership taken, no double-free'
    - title: Dangling Returns (String vs &str)
      intent: Returning a reference to a local hands back a pointer to memory that just died.
      languages:
      - name: Rust
        slug: rust
        code: "// Returning a reference to a local would dangle.\n// Rust rejects it at compile time.\n\
          fn greeting() -> &str {        // error: missing lifetime; borrows a local\n    let s = String::from(\"\
          hi\");\n    &s                          // `s` is dropped at end of scope\n}\n\n// RIGHT: hand\
          \ back ownership, not a borrow\nfn greeting() -> String { String::from(\"hi\") }"
        explanation: An owned String moves out to the caller; a borrowed &str into a local cannot outlive
          it, and the borrow checker says so.
        output: 'borrow of local: rejected (would dangle)

          owned String:    caller owns it, no dangling'
      - name: C
        slug: c
        code: "/* SMELL: returning the address of a stack local */\nchar *greeting(void) {\n    char buf[3]\
          \ = \"hi\";\n    return buf;          /* buf dies when the function returns */\n}\n\n/* RIGHT:\
          \ heap-allocate (caller frees) or pass a buffer in */\nchar *greeting(void) { return strdup(\"\
          hi\"); }"
        explanation: C will happily return &buf; the pointer dangles the instant the frame is popped.
          strdup gives the caller something that actually lives.
        output: 'stack return: dangling pointer, garbage on read

          strdup:       valid until the caller free()s it'
  - slug: cache-invalidation
    cwes:
    - id: CWE-349
      name: Acceptance of Extraneous Untrusted Data With Trusted Data
      url: https://cwe.mitre.org/data/definitions/349.html
    - id: CWE-524
      name: Use of Cache Containing Sensitive Information
      url: https://cwe.mitre.org/data/definitions/524.html
    name: Cache Invalidation
    tagline: stale data, served with confidence
    essence: A write that does not invalidate is a bug waiting for the next read.
    description: Invalidation isn't a footnote — it's business logic, a work order that takes a process
      and happens now. One of the two hard problems.
    two_hard_note: cache invalidation
    examples:
    - title: Stale Reads After a Write
      intent: Cache forever, never invalidate, and every reader sees the pre-update world.
      languages:
      - name: Python
        slug: python
        code: "cache = {}\n\n# SMELL: cache forever, never invalidate -> stale reads\ndef get_user(uid):\n\
          \    if uid not in cache:\n        cache[uid] = db.fetch(uid)\n    return cache[uid]       \
          \        # update in db? caller never sees it\n\n# RIGHT: invalidate on write; treat it as part\
          \ of the work order\ndef update_user(uid, data):\n    db.write(uid, data)\n    cache.pop(uid,\
          \ None)            # the recall happens now"
        explanation: A write that doesn't invalidate the cache is a bug waiting for the next read. Invalidation
          is a process, and it happens right now.
        output: 'no invalidation: reads show pre-update data forever

          on-write pop:    next read is fresh from db'
      - name: Go
        slug: go
        code: "// SMELL: write the DB, forget the cache -> stale forever\nfunc Update(id string, v Value)\
          \ {\n    db.Write(id, v)               // cache still holds the old value\n}\n\n// RIGHT: invalidate\
          \ (or update) the cache as part of the write\nfunc Update(id string, v Value) {\n    db.Write(id,\
          \ v)\n    cache.Delete(id)              // next read repopulates from db\n}"
        explanation: The cache is part of your write path, not a side concern. If a write doesn't touch
          it, the cache lies until eviction.
        output: 'no delete: cached read stays stale indefinitely

          with delete: next read reflects the write'
    - title: Thundering Herd on Expiry
      intent: Everything expires at the same instant and every miss stampedes the database.
      languages:
      - name: Go
        slug: go
        code: '// SMELL: TTL with no jitter -> thundering herd on expiry

          cache.Set(key, val, 60*time.Second)   // 10k keys expire at once


          // RIGHT: add jitter so expirations spread out

          ttl := 60*time.Second + time.Duration(rand.Intn(15))*time.Second

          cache.Set(key, val, ttl)'
        explanation: If everything expires at the same instant, every miss hits the database simultaneously.
          Jittered TTLs smear the load.
        output: 'fixed TTL: synchronized stampede on the DB

          jitter:    misses spread across a 15s window'
      - name: Python
        slug: python
        code: "# SMELL: every concurrent miss recomputes the same hot key\ndef get(key):\n    v = cache.get(key)\n\
          \    if v is None:\n        v = expensive(key)         # 1000 misses -> 1000 calls\n       \
          \ cache[key] = v\n    return v\n\n# RIGHT: single-flight -- one loader, the rest wait on it\n\
          def get(key):\n    with inflight.lock(key):       # per-key lock\n        v = cache.get(key)\n\
          \        if v is None:\n            v = expensive(key)\n            cache[key] = v\n       \
          \ return v"
        explanation: On a cold hot key, every concurrent reader recomputes it. A per-key lock collapses
          the herd to a single load.
        output: 'naive:        N concurrent misses -> N expensive() calls

          single-flight: 1 call, the rest reuse the result'
  - slug: threading-mutexes
    cwes:
    - id: CWE-667
      name: Improper Locking
      url: https://cwe.mitre.org/data/definitions/667.html
    - id: CWE-833
      name: Deadlock
      url: https://cwe.mitre.org/data/definitions/833.html
    - id: CWE-820
      name: Missing Synchronization
      url: https://cwe.mitre.org/data/definitions/820.html
    name: Threading & Mutexes
    tagline: locks held, ordered, or forgotten
    essence: The lock that protects you from a race is the lock that deadlocks you.
    description: Mutexes serialize access — until one is acquired out of order (deadlock) or retried in
      lockstep (livelock). Both achieve nothing.
    examples:
    - title: 'Deadlock: Acquire in One Order'
      intent: Two locks taken in opposite orders freeze forever, each thread waiting on the other.
      languages:
      - name: Python
        slug: python
        code: "# DEADLOCK: two locks taken in opposite orders\n# thread 1: lock(a) ; lock(b)\n# thread\
          \ 2: lock(b) ; lock(a)   <- each waits on the other\n\n# RIGHT: impose a global lock ordering\n\
          def transfer(src, dst, amount):\n    first, second = sorted((src, dst), key=id)\n    with first.lock,\
          \ second.lock:        # always same order\n        src.balance -= amount\n        dst.balance\
          \ += amount"
        explanation: Deadlock needs a cycle in the wait graph. Acquire locks in one consistent order and
          the cycle can't form.
        output: 'unordered: threads freeze, NOTHING ACHIEVED

          ordered:   no cycle, transfers complete'
      - name: Java
        slug: java
        code: "// SMELL: lock order depends on argument order -> deadlock\nvoid transfer(Account a, Account\
          \ b, long amt) {\n    synchronized (a) { synchronized (b) { /* ... */ } }\n}\n\n// RIGHT: order\
          \ locks by a stable key (e.g. account id)\nvoid transfer(Account a, Account b, long amt) {\n\
          \    Account first = a.id < b.id ? a : b, second = a.id < b.id ? b : a;\n    synchronized (first)\
          \ { synchronized (second) { /* ... */ } }\n}"
        explanation: transfer(x, y) and transfer(y, x) grab the locks in opposite orders. Sorting by a
          stable key gives every thread the same order.
        output: 'by-arg order: two transfers deadlock

          by-id order:  no cycle possible'
    - title: 'Livelock: Back Off With Jitter'
      intent: Both threads politely release and retry in lockstep, busy forever, achieving nothing.
      languages:
      - name: Java
        slug: java
        code: "// LIVELOCK: both threads politely back off forever\nwhile (!acquireBoth()) {\n    releaseAll();\n\
          \    Thread.sleep(0);     // both retry in lockstep, get nowhere\n}\n\n// RIGHT: randomized\
          \ backoff breaks the symmetry\nwhile (!acquireBoth()) {\n    releaseAll();\n    Thread.sleep(random.nextInt(50));\
          \   // jitter\n}"
        explanation: 'Livelock is deadlock''s busy cousin: lots of activity, zero progress. Random jitter
          desynchronizes the retries.'
        output: 'lockstep: SO MUCH IS HAPPENING, nothing done

          jitter:   one thread wins, work proceeds'
      - name: Go
        slug: go
        code: "// SMELL: spin-retry with no backoff -> two goroutines livelock\nfor !tryAcquire() {\n\
          \    release()\n    // immediately retry, in perfect step with the other\n}\n\n// RIGHT: exponential\
          \ backoff with jitter\nfor attempt := 0; !tryAcquire(); attempt++ {\n    release()\n    d :=\
          \ time.Duration(1<<attempt)*time.Millisecond + jitter()\n    time.Sleep(d)\n}"
        explanation: Tight retry loops keep two actors in sync so neither makes progress. Growing, jittered
          sleeps break the symmetry.
        output: 'no backoff: 100% CPU, no progress

          backoff:    one acquires, the other follows'
  - slug: file-network-access
    cwes:
    - id: CWE-22
      name: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')
      url: https://cwe.mitre.org/data/definitions/22.html
    - id: CWE-367
      name: Time-of-check Time-of-use (TOCTOU) Race Condition
      url: https://cwe.mitre.org/data/definitions/367.html
    - id: CWE-73
      name: External Control of File Name or Path
      url: https://cwe.mitre.org/data/definitions/73.html
    name: File & Network Access
    tagline: the world between processes is unreliable
    essence: Disk and network calls fail partway, arrive twice, or never arrive at all.
    description: TOCTOU file races, partial writes, dropped packets, and retries without idempotency —
      the failures the Fallacies of Distributed Computing warn about.
    examples:
    - title: TOCTOU File Race
      intent: Checking then using a path leaves a gap where the file can change underneath you.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: check-then-use -- the file can change in the gap (TOCTOU)\nif os.path.exists(path):\
          \          # an attacker swaps the file here...\n    with open(path) as f:          # ...so\
          \ you open something else\n        return f.read()\n\n# RIGHT: just try to open it; let one\
          \ syscall decide atomically\ntry:\n    with open(path) as f:\n        return f.read()\nexcept\
          \ FileNotFoundError:\n    return None"
        explanation: Between exists() and open() the path can be replaced (a symlink swap). Opening directly
          collapses check and use into one atomic operation.
        output: 'check-then-open: races, symlink swaps, surprises

          try/except:     one atomic syscall, no gap'
      - name: Bash
        slug: bash
        code: "# SMELL: test then act -- classic TOCTOU window\nif [ -f \"$f\" ]; then\n  rm \"$f\"  \
          \        # $f may have changed between test and rm\nfi\n\n# RIGHT: act and tolerate the race\n\
          rm -f \"$f\"         # idempotent: no error if it is already gone"
        explanation: The [ -f ] test and the rm are two steps with a gap between them. rm -f is a single
          idempotent action that doesn't care about the race.
        output: '[ -f ] then rm: window for a swap

          rm -f:         atomic, idempotent'
    - title: Retry & Timeout
      intent: A timed-out call may have already succeeded; a call with no deadline can hang forever.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: blind retry of a non-idempotent call -> double charge\nfor _ in range(3):\n  \
          \  try:\n        return charge(card, amount)   # a timeout is not a failure!\n    except Timeout:\n\
          \        continue                       # the first call may have won\n\n# RIGHT: an idempotency\
          \ key makes retries safe to repeat\nkey = idempotency_key(order)\nfor _ in range(3):\n    try:\n\
          \        return charge(card, amount, idempotency_key=key)\n    except Timeout:\n        continue\
          \        # the server dedupes by key -> at most one charge"
        explanation: A timeout means 'unknown', not 'failed'. Retrying a non-idempotent call can double
          it; an idempotency key lets the server collapse retries to one effect.
        output: 'blind retry: a timed-out success is charged again

          idem key:    server collapses retries to one charge'
      - name: Go
        slug: go
        code: '// SMELL: no timeout -- a stalled peer hangs the caller forever

          resp, err := http.Get(url)            // can block indefinitely


          // RIGHT: bound every network call with a context deadline

          ctx, cancel := context.WithTimeout(ctx, 2*time.Second)

          defer cancel()

          req, _ := http.NewRequestWithContext(ctx, "GET", url, nil)

          resp, err := http.DefaultClient.Do(req)'
        explanation: Without a deadline, one slow peer ties up a connection (and a goroutine) forever.
          A context timeout fails fast and frees the resource.
        output: 'no timeout: one slow peer exhausts the pool

          with ctx:   fails fast at 2s, resources freed'
  - slug: resource-leaks
    cwes:
    - id: CWE-404
      name: Improper Resource Shutdown or Release
      url: https://cwe.mitre.org/data/definitions/404.html
    - id: CWE-772
      name: Missing Release of Resource after Effective Lifetime
      url: https://cwe.mitre.org/data/definitions/772.html
    - id: CWE-401
      name: Missing Release of Memory after Effective Lifetime
      url: https://cwe.mitre.org/data/definitions/401.html
    - id: CWE-459
      name: Incomplete Cleanup
      url: https://cwe.mitre.org/data/definitions/459.html
    - id: CWE-775
      name: Missing Release of File Descriptor or Handle after Effective Lifetime
      url: https://cwe.mitre.org/data/definitions/775.html
    name: Resource Leaks & Improper Shutdown
    tagline: opened, never closed
    essence: A handle held past its lifetime — file, socket, connection, lock — is shared state nobody
      released; leaks accumulate until the system starves.
    description: Every acquire needs a matching release. Forget it — or skip it on the error path — and
      file descriptors, connections, and memory pile up until the pool, the heap, or the OS limit runs
      out. The crash lands far from the leak, long after the request that caused it.
    examples:
    - title: Opened, Never Closed
      intent: A resource acquired in a loop and never released exhausts a finite pool.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: a connection per iteration, none ever returned\nfor row in rows:\n    conn = pool.acquire()\
          \      # leaks: never released\n    conn.execute(row)\n# ...pool exhausted; the next acquire()\
          \ blocks forever\n\n# RIGHT: a context manager releases on every path\nfor row in rows:\n  \
          \  with pool.acquire() as conn:   # returned even on exception\n        conn.execute(row)"
        explanation: An acquire with no release drains the pool; once it's empty, every caller hangs.
          A with-block ties release to scope exit, including exceptions.
        output: 'leak: pool drains -> acquire() hangs

          with: connection returned every iteration'
      - name: Go
        slug: go
        code: '// SMELL: response body is a file descriptor -- never closed

          resp, _ := http.Get(url)

          body, _ := io.ReadAll(resp.Body)   // resp.Body leaks every call

          // thousands of requests -> "too many open files"


          // RIGHT: defer Close right after the error check

          resp, err := http.Get(url)

          if err != nil { return err }

          defer resp.Body.Close()            // released when the function returns

          body, _ := io.ReadAll(resp.Body)'
        explanation: resp.Body holds an open socket/fd; without Close it leaks until the process hits
          its descriptor limit. defer pins the release to function exit.
        output: 'no close: fd leak -> too many open files

          defer:    each body closed on return'
    - title: Cleanup Skipped on the Error Path
      intent: An early return or exception jumps over the release, so the happy path closes but the failure
        path leaks.
      languages:
      - name: Java
        slug: java
        code: "// SMELL: an exception before close() leaks the stream\nInputStream in = new FileInputStream(path);\n\
          parse(in);                 // throws -> close() never runs\nin.close();\n\n// RIGHT: try-with-resources\
          \ closes on every exit path\ntry (InputStream in = new FileInputStream(path)) {\n    parse(in);\
          \             // close() runs even if parse throws\n}"
        explanation: A close() after the work only runs when the work succeeds; any throw leaks the handle.
          try-with-resources guarantees close on normal and exceptional exit.
        output: 'manual: parse() throws -> stream leaked

          try-with: closed on success and on throw'
      - name: C
        slug: c
        code: "/* SMELL: early return leaks the file and the buffer */\nint load(const char *path) {\n\
          \    FILE *f = fopen(path, \"r\");\n    char *buf = malloc(N);\n    if (read_header(f) < 0)\
          \ return -1;   /* leaks f AND buf */\n    /* ...use buf... */\n    free(buf); fclose(f);\n \
          \   return 0;\n}\n\n/* RIGHT: single cleanup path via goto */\nint load(const char *path) {\n\
          \    int rc = -1;\n    FILE *f = fopen(path, \"r\");\n    char *buf = malloc(N);\n    if (read_header(f)\
          \ < 0) goto out;\n    rc = 0;\nout:\n    free(buf); if (f) fclose(f);   /* always runs */\n\
          \    return rc;\n}"
        explanation: Each early return must remember to free everything acquired so far — easy to miss.
          A single cleanup label centralizes release so no exit path can skip it.
        output: 'early return: f and buf leaked on error

          goto out:   every exit frees both'
- id: common-defects
  cwe_pillar:
    id: CWE-710
    name: Improper Adherence to Coding Standards
    url: https://cwe.mitre.org/data/definitions/710.html
  name: Common Software Defects
  short_name: Common
  category: common
  tagline: the everyday smells beneath the stateful ones
  color_primary: 94A3B8
  color_secondary: CBD5E1
  color_deep: 64748B
  description: 'The everyday defects in every codebase, read by how they''re caught: readability smells
    a reviewer sees (duplication, magic numbers, bad names), correctness bugs tests catch (DRY violations,
    off-by-one, sloppy error handling), and security defects a scanner finds (SCA, SAST, DAST). Most don''t
    crash on their own -- they make the stateful bugs harder to see, and the worst of them become vulnerabilities.'
  essence: Code smells suggest software defects; software defects suggest vulnerabilities. These are the
    smells everyone makes.
  symptoms:
  - The same change has to be made in several places
  - Numbers and strings with no explanation
  - Names that have to be decoded before they're understood
  - Errors swallowed by empty catch blocks
  - “Works on my machine” traced to a version drift
  - A scanner flags an injectable query or an exposed endpoint
  causes:
  - copy-pasta & DRY violations
  - magic numbers and strings
  - off-by-one boundaries
  - naming problems
  - swallowed or fail-open error handling
  - unpinned, unscanned dependencies
  - untrusted input reaching a dangerous sink
  tools_hurt:
  - copy & paste
  - hard-coded literals
  - abbreviations & single letters
  - empty catch / except blocks
  - unpinned dependencies
  - string-built SQL, shells, and paths
  philosophies:
  - name: 'DRY: Don''t Repeat Yourself'
    url: https://en.wikipedia.org/wiki/Don%27t_repeat_yourself
  - name: 'Refactoring Guru: Code Smells'
    url: https://refactoring.guru/refactoring/smells
  - name: OWASP Top Ten
    url: https://owasp.org/www-project-top-ten/
  - name: Semantic Versioning
    url: https://semver.org/
  - name: Lockfiles for all
    url: https://classic.yarnpkg.com/blog/2016/11/24/lockfiles-for-all/
  two_hard_note: naming things
  name_qualities:
    title: Good names have these qualities
    items:
    - - Explicit
      - say what it is, not what it abbreviates
    - - Grokable
      - understood at a glance, in context
    - - Consistent
      - the same idea wears the same word everywhere
    - - Meaningful
      - carries intent, not implementation
    - - Pronounceable
      - you can say it out loud in a standup
    - - Intentional
      - chosen, not whatever was typed first
    - - Namespaced
      - scoped so two ideas don't collide
    rule: Objects & classes are noun phrases. Methods & functions are verb phrases.
  defects:
  - slug: copy-pasta
    cwes:
    - id: CWE-1041
      name: Use of Redundant Code
      url: https://cwe.mitre.org/data/definitions/1041.html
    name: Copy-Pasta Mistakes
    tagline: the same logic pasted until the copies disagree
    essence: 'Every paste is a future bug: one copy gets fixed, the others rot.'
    description: Duplicated logic drifts apart. A fix applied to one copy and missed in the others is
      the most common way a closed bug quietly reopens.
    examples:
    - title: Validation That Drifts
      intent: The same check pasted in two places. Now a fix is two fixes -- and you'll miss one.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// SMELL: the same validation, copied and drifting apart

          if (!email.includes("@") || email.length > 254) reject(email);

          // ...200 lines later...

          if (!addr.includes("@") || addr.length > 255) reject(addr);  // 254? 255?


          // RIGHT: one source of truth

          const isValidEmail = (e) => e.includes("@") && e.length <= 254;

          if (!isValidEmail(email)) reject(email);'
        explanation: Copies drift. The pasted check used 255, the original 254 -- a bug born the moment
          someone duplicated it.
        output: 'copies: two rules that disagree by one

          shared: one rule, fixed once, applied everywhere'
    - title: Auth Copied Per Endpoint
      intent: Copy-pasta is most dangerous where it guards access -- one forgotten copy is an open door.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: three endpoints, three hand-rolled auth checks\ndef view_a(req):\n    if not req.user\
          \ or req.user.role != \"admin\": return deny()\ndef view_b(req):\n    if not req.user or req.user.role\
          \ != \"admin\": return deny()\n\n# RIGHT: extract the rule into a decorator\ndef admin_only(view):\n\
          \    def wrapped(req):\n        if not req.user or req.user.role != \"admin\":\n           \
          \ return deny()\n        return view(req)\n    return wrapped"
        explanation: Auth is exactly where copy-pasta turns into a vulnerability -- one forgotten copy
          is an open door.
        output: 'copied:    miss one endpoint -> privilege escalation

          decorator: the rule can''t be forgotten'
    - title: The Pasted Constant
      intent: A duplicated literal gets 'tuned' in one place only, and the copies silently disagree.
      languages:
      - name: TypeScript
        slug: typescript
        code: '// SMELL: the same timeout pasted, then one gets tweaked

          setTimeout(retry, 30000);   // payments.ts

          setTimeout(retry, 3000);    // billing.ts  -- typo? or intentional?


          // RIGHT: one named constant, imported everywhere

          export const RETRY_MS = 30_000;

          setTimeout(retry, RETRY_MS);'
        explanation: Duplicated literals drift independently. A single exported constant has one value
          and one place to change it.
        output: 'pasted: 30000 vs 3000 -- which is right?

          shared: RETRY_MS, identical everywhere'
  - slug: dry-rule-of-three
    cwes:
    - id: CWE-1041
      name: Use of Redundant Code
      url: https://cwe.mitre.org/data/definitions/1041.html
    - id: CWE-710
      name: Improper Adherence to Coding Standards
      url: https://cwe.mitre.org/data/definitions/710.html
    name: DRY -- Don't Repeat Yourself
    tagline: extract on the third repeat, not the first
    essence: Two copies is a coincidence; three is a pattern that has earned a name.
    description: 'DRY says every piece of knowledge has one authoritative home. The rule of three tempers
      it: don''t abstract until the third occurrence, or you''ll build the wrong abstraction and couple
      things that should move apart.'
    examples:
    - title: The Rule of Three
      intent: 'When to extract: the first copy is fine, the second is a coincidence, the third confirms
        a pattern.'
      languages:
      - name: Python
        slug: python
        code: "# 1st time: just write it.\nprice_a = qty_a * unit_a * (1 - discount_a)\n# 2nd time: a\
          \ coincidence -- resist abstracting yet.\nprice_b = qty_b * unit_b * (1 - discount_b)\n# 3rd\
          \ time: NOW extract -- the pattern is proven.\ndef line_total(qty, unit, discount):\n    return\
          \ qty * unit * (1 - discount)"
        explanation: Two occurrences may be coincidence; the third confirms a real pattern. Extracting
          too early guesses the wrong shape.
        output: 'early: an abstraction that fights the 3rd case

          three: extract once the pattern is proven'
    - title: Knowledge, Not Code
      intent: Two snippets that look identical can encode different decisions. DRY-ing them couples the
        unrelated.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// These LOOK identical, but encode two different policies:

          const taxRate = (amt) => amt * 0.0825;   // sales tax (law)

          const tipRate = (amt) => amt * 0.0825;   // suggested tip (today)


          // WRONG-DRY: merge them and they change together by accident

          const rate = (amt) => amt * 0.0825;      // now tip can never differ from tax


          // RIGHT: same value, different KNOWLEDGE -- keep them apart

          const SALES_TAX = 0.0825, DEFAULT_TIP = 0.0825;'
        explanation: DRY is about single sources of knowledge, not identical text. Merging coincidentally-equal
          code couples decisions that should evolve independently.
        output: 'merged:   changing tip silently changes tax

          separate: each rate evolves on its own'
    - title: Single Source of Truth
      intent: Knowledge with one home cannot disagree with itself; copies eventually do.
      languages:
      - name: Go
        slug: go
        code: '// SMELL: the same rule compiled in three files, subtly drifted

          var reA = regexp.MustCompile(`^\d{3}-\d{4}$`)

          var reB = regexp.MustCompile(`^\d{3}-\d{3}$`)  // typo, drifted


          // RIGHT: one exported pattern, defined once

          var PhoneRE = regexp.MustCompile(`^\d{3}-\d{4}$`)'
        explanation: A rule with a single definition cannot contradict itself. The drifted copy is a bug
          the original never had.
        output: 'copies: two patterns, one concept

          shared: PhoneRE, defined once'
  - slug: magic-numbers
    cwes:
    - id: CWE-547
      name: Use of Hard-coded, Security-relevant Constants
      url: https://cwe.mitre.org/data/definitions/547.html
    - id: CWE-798
      name: Use of Hard-coded Credentials
      url: https://cwe.mitre.org/data/definitions/798.html
    name: Magic Numbers
    tagline: literals with no name and no explanation
    essence: A number the reader has to decode is a comment you forgot to write.
    description: Bare literals -- 86400, 0.0825, 200, "admin" -- force the reader to reconstruct intent
      and scatter a value across the codebase with no single place to change it.
    examples:
    - title: Name the Intent
      intent: A literal with no name. The reader has to guess what 86400 or 0.0825 means.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// SMELL: what is 86400? why 0.0825? why 3?

          if (now - created > 86400) expire();

          const total = price * 1.0825;

          if (retries > 3) giveUp();


          // RIGHT: name the intent

          const SECONDS_PER_DAY = 86_400;

          const SALES_TAX = 0.0825;

          const MAX_RETRIES = 3;

          if (now - created > SECONDS_PER_DAY) expire();'
        explanation: A named constant documents the value and gives it one place to change. The number
          stops being a riddle.
        output: 'magic: reader greps for 86400 across the repo

          named: SECONDS_PER_DAY reads itself'
    - title: Status Codes & Thresholds
      intent: Bare codes and limits live only in the author's head; enums make the legal set explicit.
      languages:
      - name: Java
        slug: java
        code: '// SMELL: 200, 404, 7 -- meaning lives only in your head

          if (status == 200) ok();

          if (daysOpen > 7) escalate();


          // RIGHT: enums and named constants

          if (status == HttpStatus.OK) ok();

          static final int ESCALATION_THRESHOLD_DAYS = 7;

          if (daysOpen > ESCALATION_THRESHOLD_DAYS) escalate();'
        explanation: Enums and constants make illegal values harder to write and legal ones self-explaining.
        output: 'magic: 200 could be anything

          enum:  HttpStatus.OK is unambiguous'
    - title: Magic Strings Too
      intent: A literal string is a magic number in disguise -- invisible to the type checker, easy to
        mistype.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: bare strings are magic numbers in disguise\nif user.role == \"admin\":       \
          \   # typo \"Admin\" silently denies\n    grant()\n\n# RIGHT: a named enum the type checker\
          \ can police\nclass Role(str, Enum):\n    ADMIN = \"admin\"\n\nif user.role == Role.ADMIN:\n\
          \    grant()"
        explanation: 'A literal string is as magic as a literal number: the type checker can''t see it
          and a typo fails silently. An enum names the legal set.'
        output: 'string: ''Admin'' != ''admin'', silent deny

          enum:   one canonical value'
  - slug: off-by-one-errors
    cwes:
    - id: CWE-193
      name: Off-by-one Error
      url: https://cwe.mitre.org/data/definitions/193.html
    - id: CWE-787
      name: Out-of-bounds Write
      url: https://cwe.mitre.org/data/definitions/787.html
    name: Off-by-One Errors
    tagline: the boundary every stateful tool gets wrong
    essence: Off-by-one isn't one language's bug -- it's what every counter, cursor, and pointer drifts
      into.
    description: 'The fencepost bug: a bound one too big or one too small, so the last element is dropped
      or one past the end is read. It is the boundary defect every stateful tool can produce -- shown
      here generic, then via a different stateful mechanism, across nine languages.'
    two_hard_note: off-by-one errors
    examples:
    - title: Generic Off-by-One
      intent: 'The plain fencepost: an inclusive bound or a len-1 where the language already gives you
        the right range.'
      languages:
      - name: JavaScript
        slug: javascript
        code: '// WRONG: length - 1 silently skips the last element

          for (let i = 0; i < arr.length - 1; i++) send(arr[i]);


          // RIGHT: iterate the whole range

          for (const item of arr) send(item);'
        explanation: Subtracting 1 from the bound is the classic fencepost error. for...of removes the
          bound you can get wrong.
        output: 'input: [a, b, c, d, e]

          wrong: a b c d   (e is lost)

          right: a b c d e'
      - name: TypeScript
        slug: typescript
        code: '// WRONG: <= on a half-open length reads one past the end

          let total = 0;

          for (let i = 0; i <= xs.length; i++) total += xs[i];  // xs[length] is undefined


          // RIGHT: strict <, or reduce and never index at all

          const total = xs.reduce((a, b) => a + b, 0);'
        explanation: An array of length n has no index n. <= reads xs[length] (undefined), turning the
          sum into NaN.
        output: 'wrong: total === NaN

          right: the exact sum'
      - name: Python
        slug: python
        code: "items = [1, 2, 3, 4, 5]\n\n# WRONG: range() is already exclusive of the end\nfor i in range(len(items)\
          \ - 1):\n    process(items[i])\n\n# RIGHT: iterate the object, not an index\nfor item in items:\n\
          \    process(item)"
        explanation: range(n) already stops before n. Subtracting 1 on top of that drops the final element.
        output: 'wrong: 1 2 3 4

          right: 1 2 3 4 5'
      - name: Ruby
        slug: ruby
        code: '# WRONG: .. is inclusive, so it reads one past the end

          (0..arr.length).each { |i| puts arr[i] }   # last is arr[length] -> nil


          # RIGHT: ... is exclusive (or just iterate the values)

          (0...arr.length).each { |i| puts arr[i] }

          arr.each { |v| puts v }'
        explanation: Ruby's .. range includes the end; ... excludes it. Indexing with the inclusive range
          reads one element too far (nil).
        output: 'wrong: every value, then a blank line (nil)

          right: every value, once'
      - name: Go
        slug: go
        code: "// WRONG: <= indexes one past the slice -> panic\nfor i := 0; i <= len(xs); i++ {\n   \
          \ fmt.Println(xs[i])\n}\n\n// RIGHT: use <, or range\nfor _, x := range xs { fmt.Println(x)\
          \ }"
        explanation: len(xs) is one past the last valid index. <= panics with index out of range.
        output: 'wrong: panic: index out of range [len]

          right: every element'
      - name: Rust
        slug: rust
        code: "// WRONG: 0..=n is inclusive -> indexes v.len()\nfor i in 0..=v.len() {\n    println!(\"\
          {}\", v[i]);   // panics on the last i\n}\n\n// RIGHT: 0..n is half-open (or just iterate)\n\
          for x in &v { println!(\"{}\", x); }"
        explanation: 0..=v.len() includes v.len(), which is out of bounds. 0..v.len() is half-open; iterating
          avoids the index entirely.
        output: 'wrong: panic: index out of bounds

          right: every element'
      - name: Java
        slug: java
        code: '// WRONG: <= walks one past the end -> exception

          for (int i = 0; i <= arr.length; i++) process(arr[i]);


          // RIGHT: use < not <=

          for (int i = 0; i < arr.length; i++) process(arr[i]);'
        explanation: <= reads index 5 of a length-5 array and throws ArrayIndexOutOfBoundsException.
        output: 'wrong: ArrayIndexOutOfBoundsException: 5

          right: 1 2 3 4 5'
      - name: Kotlin
        slug: kotlin
        code: '// WRONG: 0..size is inclusive of size

          for (i in 0..list.size) print(list[i])   // IndexOutOfBounds on size


          // RIGHT: 0 until size is half-open

          for (i in 0 until list.size) print(list[i])'
        explanation: Kotlin's .. is inclusive, so 0..size visits the invalid index size. until is the
          half-open form.
        output: 'wrong: IndexOutOfBoundsException

          right: every element'
      - name: C
        slug: c
        code: '/* WRONG: <= reads one past the array -- undefined behavior */

          for (int i = 0; i <= 5; i++) process(arr[i]);   /* arr[5] is garbage */


          /* RIGHT */

          for (int i = 0; i < 5; i++) process(arr[i]);'
        explanation: In C the off-by-one does not throw; it reads adjacent memory. Silent corruption is
          worse than a crash.
        output: 'wrong: 1 2 3 4 5 <garbage>

          right: 1 2 3 4 5'
    - title: Off-by-One With a Stateful Tool
      intent: The same boundary bug, but produced by a different stateful mechanism in each language --
        a counter, a cursor, an operator, a pointer.
      languages:
      - name: JavaScript
        slug: javascript
        code: "// STATEFUL TOOL: the ++ operator mutates i inside the test\nlet i = 0;\nwhile (i++ < arr.length)\
          \ {     // i is advanced even on the final test\n  send(arr[i]);                // skips arr[0],\
          \ reads arr[length] (undefined)\n}\n\n// RIGHT: separate the test from the mutation\nfor (let\
          \ i = 0; i < arr.length; i++) send(arr[i]);"
        explanation: The ++ operator mutates i as a side effect of the comparison, so the index and the
          bound disagree by one.
        output: 'wrong: skips first, reads one past the end

          right: every element, once'
      - name: TypeScript
        slug: typescript
        code: "// STATEFUL TOOL: a mutable cursor advanced by hand\nlet cursor = 0;\nconst out: string[]\
          \ = [];\nwhile (cursor <= items.length) {   // <= overshoots by one\n  out.push(items[cursor]);\
          \         // last push is items[length] -> undefined\n  cursor += 1;\n}\n\n// RIGHT: let the\
          \ language own the bound\nconst out = items.map((x) => x);"
        explanation: A hand-mutated let cursor with <= reads one slot past the array; let-binding the
          iteration removes the cursor you can get wrong.
        output: 'wrong: trailing undefined in out

          right: a clean copy of items'
      - name: Python
        slug: python
        code: "# STATEFUL TOOL: a hand-mutated counter and a fixed bound drift apart\ni = 0\ntotal = 0\n\
          while i <= len(nums):        # <= runs one extra iteration\n    total += nums[i]         # IndexError\
          \ on the last pass\n    i += 1\n\n# RIGHT: iterate the object; no counter to mutate\ntotal =\
          \ sum(nums)"
        explanation: The mutable counter i and the <= bound are maintained separately, so they fall out
          of step by one.
        output: 'wrong: IndexError: list index out of range

          right: the exact sum'
      - name: Ruby
        slug: ruby
        code: "# STATEFUL TOOL: a mutated offset added to the loop index\noffset = 1\narr.each_with_index\
          \ do |_, i|\n  puts arr[i + offset]   # last read is arr[size] -> nil\nend\n\n# RIGHT: no offset;\
          \ iterate the values directly\narr.each { |v| puts v }"
        explanation: Mutating an offset and adding it to the index pushes every access one past where
          you think you are (returns nil at the end).
        output: 'wrong: shifted by one, trailing nil

          right: each value in place'
      - name: Go
        slug: go
        code: "// STATEFUL TOOL: a manual index drives the loop past the slice\ni := 0\nfor i <= len(xs)\
          \ {           // <= indexes one past the slice\n    fmt.Println(xs[i])       // panic: index\
          \ out of range\n    i++\n}\n\n// RIGHT: range owns the bound\nfor _, x := range xs { fmt.Println(x)\
          \ }"
        explanation: Driving the loop with a mutable index and <= len(xs) reads one past the slice; range
          removes the manual bound.
        output: 'wrong: panic: index out of range

          right: every element'
      - name: Rust
        slug: rust
        code: "// STATEFUL TOOL: a `mut` counter advanced by hand\nlet mut i = 0;\nwhile i <= v.len()\
          \ {          // <= goes one past the end\n    println!(\"{}\", v[i]);     // panics: index out\
          \ of bounds\n    i += 1;\n}\n\n// RIGHT: iterate; the bound is not yours to manage\nfor x in\
          \ &v { println!(\"{}\", x); }"
        explanation: A let mut index incremented by hand with <= indexes v.len(), which is one past the
          last valid index.
        output: 'wrong: panic: index out of bounds

          right: every element'
      - name: Java
        slug: java
        code: "// STATEFUL TOOL: manual for-loop control mutates the index\nint n = list.size();\nfor\
          \ (int i = 0; i <= n; i++) {   // <= reads index size -> exception\n    System.out.println(list.get(i));\n\
          }\n\n// RIGHT: half-open bound, no manual index\nlist.forEach(System.out::println);"
        explanation: Hand-rolled for-loop control with <= walks one past the last index; for-each hands
          the bound to the collection.
        output: 'wrong: IndexOutOfBoundsException

          right: every element'
      - name: Kotlin
        slug: kotlin
        code: "// STATEFUL TOOL: a `var` index over an inclusive range\nvar i = 0\nwhile (i <= list.size)\
          \ {       // <= visits the invalid index size\n    println(list[i])           // IndexOutOfBoundsException\n\
          \    i += 1\n}\n\n// RIGHT: `until` is half-open; no var to mismanage\nfor (x in list) println(x)"
        explanation: A mutated var index with <= list.size reads one past the end. until is the half-open
          range that can't.
        output: 'wrong: IndexOutOfBoundsException

          right: every element'
      - name: C
        slug: c
        code: "/* STATEFUL TOOL: a mutated pointer walks one element too far */\nint *p = arr;\nfor (int\
          \ i = 0; i <= 5; i++) {   /* <= and *p++ both overshoot */\n    printf(\"%d \", *p++);     \
          \     /* reads arr[5]: past the array */\n}\n\n/* RIGHT: stop before the end */\nfor (int i\
          \ = 0; i < 5; i++) printf(\"%d \", arr[i]);"
        explanation: The mutated pointer *p++ combined with <= reads one past the array -- undefined behavior,
          not a clean crash.
        output: 'wrong: 1 2 3 4 5 <garbage>

          right: 1 2 3 4 5'
  - slug: naming-problems
    cwes:
    - id: CWE-1099
      name: Inconsistent Naming Conventions for Identifiers
      url: https://cwe.mitre.org/data/definitions/1099.html
    - id: CWE-1078
      name: Inappropriate Source Code Style or Formatting
      url: https://cwe.mitre.org/data/definitions/1078.html
    name: Naming Problems
    tagline: names that have to be decoded before they're understood
    essence: Good names are the cheapest documentation you'll ever write.
    description: Opaque abbreviations, inconsistent vocabulary, and classes named like verbs force the
      reader to reconstruct meaning the code should have stated outright.
    examples:
    - title: Opaque Abbreviations
      intent: Single letters and abbreviations make the reader rebuild meaning from the body.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: what does this do? what is d? what is x?\ndef proc(d, x):\n    return [i for i\
          \ in d if i[1] > x]\n\n# RIGHT: names carry the intent\ndef users_older_than(users, min_age):\n\
          \    return [u for u in users if u.age > min_age]"
        explanation: proc/d/x force the reader to reconstruct meaning from the body. Verb-phrase functions
          and noun-phrase data tell the story.
        output: 'proc(d, x):              opaque

          users_older_than(...):   reads like a sentence'
    - title: Inconsistent Vocabulary
      intent: Three words for one idea is three things to memorize and a daily source of confusion.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// SMELL: inconsistent words for the same idea

          getUser(); fetchClient(); loadCustomer();   // user? client? customer?


          // RIGHT: one consistent vocabulary, verb + noun

          getCustomer(); listCustomers(); updateCustomer();'
        explanation: Consistency is a naming quality. One concept should wear one word everywhere it appears.
        output: 'mixed:      three names, one concept, daily confusion

          consistent: predictable API, less to memorize'
    - title: Nouns and Verbs
      intent: Objects are noun phrases; methods are verb phrases; booleans read as yes/no questions.
      languages:
      - name: TypeScript
        slug: typescript
        code: "// SMELL: a class named like an action, a method named like a thing\nclass DoValidation\
          \ {                 // a class is a noun, not a verb\n  result(u: User): boolean { return u.age\
          \ >= 18 }   // method should be a verb\n}\n\n// RIGHT: noun-phrase type, verb-phrase method,\
          \ boolean as a question\nclass AgePolicy {\n  isAdult(u: User): boolean { return u.age >= 18\
          \ }\n}"
        explanation: Objects and classes are noun phrases; methods and functions are verb phrases; booleans
          read as questions (isAdult).
        output: 'DoValidation.result(): backwards

          AgePolicy.isAdult():   reads like a sentence'
  - slug: error-handling
    cwes:
    - id: CWE-755
      name: Improper Handling of Exceptional Conditions
      url: https://cwe.mitre.org/data/definitions/755.html
    - id: CWE-390
      name: Detection of Error Condition Without Action
      url: https://cwe.mitre.org/data/definitions/390.html
    - id: CWE-391
      name: Unchecked Error Condition
      url: https://cwe.mitre.org/data/definitions/391.html
    - id: CWE-209
      name: Generation of Error Message Containing Sensitive Information
      url: https://cwe.mitre.org/data/definitions/209.html
    name: Poor Error Handling
    tagline: swallowed failures that surface later as something worse
    essence: An error you ignore becomes a crash, a corruption, or a breach.
    description: 'Empty catches, ignored return codes, and fail-open defaults turn a small handled error
      into a silent failure. The deck''s lesson lands here: software that crashes becomes a Denial of
      Service, and a security check that fails open becomes an authorization bypass.'
    examples:
    - title: The Empty Catch
      intent: Swallowing an exception turns a clear failure into a confusing one, fifty lines away.
      languages:
      - name: JavaScript
        slug: javascript
        code: "// SMELL: the error is swallowed; the program limps on corrupt\nlet user;\ntry {\n  user\
          \ = JSON.parse(body);\n} catch (e) { /* ignore */ }     // user is undefined, used later\n\n\
          // RIGHT: handle it, or fail loudly -- never swallow\ntry {\n  user = JSON.parse(body);\n} catch\
          \ (e) {\n  return res.status(400).json({ error: \"invalid body\" });\n}"
        explanation: An empty catch defers the failure to a later, more confusing crash. Either handle
          the error meaningfully or let it propagate.
        output: 'swallow: undefined access crashes elsewhere

          handle:  a clean 400 at the source'
      - name: Java
        slug: java
        code: "// SMELL: catch (Exception) hides bugs you never meant to catch\ntry {\n    transfer(amount);\n\
          } catch (Exception e) {           // also catches NPEs and logic bugs\n    log.info(\"retrying\"\
          );         // and discards the stack trace\n}\n\n// RIGHT: catch the specific, recoverable exception;\
          \ keep the cause\ntry {\n    transfer(amount);\n} catch (InsufficientFundsException e) {\n \
          \   notifyUser(e);\n}"
        explanation: Catch-all blocks bury real defects and throw away the stack trace. Catch the narrowest
          exception you can actually recover from.
        output: 'broad:  a logic bug looks like a retry

          narrow: only the expected failure is handled'
    - title: Ignored Return Codes
      intent: Languages that return errors as values let you discard them -- and the discard is a decision
        to be surprised later.
      languages:
      - name: Go
        slug: go
        code: '// SMELL: the error is discarded with _

          f, _ := os.Open(path)       // f may be nil

          defer f.Close()             // nil pointer dereference


          // RIGHT: check every error the moment it returns

          f, err := os.Open(path)

          if err != nil { return err }

          defer f.Close()'
        explanation: Discarding err with _ defers the failure to a nil dereference. Go returns errors
          as values precisely so you check them at the call site.
        output: 'ignored: panic on nil f

          checked: the failure is handled where it happens'
      - name: C
        slug: c
        code: '/* SMELL: malloc can return NULL; the unchecked write corrupts memory */

          char *buf = malloc(n);

          memcpy(buf, src, n);        /* segfault or worse if buf == NULL */


          /* RIGHT: check the return code before you trust it */

          char *buf = malloc(n);

          if (!buf) return -1;

          memcpy(buf, src, n);'
        explanation: In C the only signal is the return value. An unchecked allocation failure becomes
          silent corruption.
        output: 'unchecked: undefined behavior on OOM

          checked:   a clean error path'
    - title: Fail-Open vs Fail-Closed
      intent: When a security check errors, the safe default is to deny. Fail-open turns an outage into
        a bypass.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: on error, default to allowing the request (fail OPEN)\ndef is_authorized(token):\n\
          \    try:\n        return verify(token)\n    except Exception:\n        return True        \
          \    # a verifier outage grants everyone access\n\n# RIGHT: on error, deny (fail CLOSED)\ndef\
          \ is_authorized(token):\n    try:\n        return verify(token)\n    except Exception:\n   \
          \     return False"
        explanation: When a security check errors, the safe default is to deny. Fail-open turns an outage
          into an authorization bypass -- the defect becoming a vulnerability.
        output: 'fail-open:   verifier down -> everyone is admin

          fail-closed: verifier down -> nobody slips through'
  - slug: dependency-issues
    cwes:
    - id: CWE-1395
      name: Dependency on Vulnerable Third-Party Component
      url: https://cwe.mitre.org/data/definitions/1395.html
    - id: CWE-1104
      name: Use of Unmaintained Third Party Components
      url: https://cwe.mitre.org/data/definitions/1104.html
    - id: CWE-937
      name: Using Components with Known Vulnerabilities
      url: https://cwe.mitre.org/data/definitions/937.html
    name: Dependency Issues (SCA)
    tagline: unpinned, unscanned, and unreproducible supply chains
    essence: Code you didn't write still ships in your build -- pin it, lock it, and scan it.
    description: 'Software Composition Analysis is about the code you depend on: unpinned versions make
      builds non-reproducible, missing lockfiles let the tree drift, and unscanned dependencies carry
      known CVEs straight into production.'
    examples:
    - title: Pin the Tree
      intent: Caret ranges float to whatever published last; a committed lockfile makes installs byte-identical.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// SMELL: caret ranges float to whatever published last

          "dependencies": { "left-pad": "^1.0.0" }   // 1.0.0? 1.9.3? who knows


          // RIGHT: commit the lockfile so installs are byte-identical

          // package-lock.json / yarn.lock pins the entire tree.

          // CI: `npm ci` (not `npm install`) installs exactly the lock.'
        explanation: ^1.0.0 resolves differently over time. A committed lockfile makes every machine install
          the same tree -- the cure for 'works on my machine'.
        output: 'no lock: two devs, two dependency trees

          npm ci:  identical install everywhere'
    - title: Pin the Versions (and Scan Them)
      intent: Unpinned requirements drift on every install; pinning freezes the build and lets a scanner
        check for CVEs.
      languages:
      - name: Python
        slug: python
        code: '# SMELL: unpinned requirements drift on every install

          requests

          flask


          # RIGHT: pin exact versions (and hashes), then scan them

          requests==2.32.3   # produced by pip-compile (pip-tools)

          flask==3.0.3

          # CI: `pip-audit` flags pinned versions with known CVEs'
        explanation: Pinning exact versions freezes the build; an SCA tool (pip-audit, Dependabot) then
          checks those pins against vulnerability databases.
        output: 'unpinned: surprise upgrade breaks prod at 2am

          pinned:   reproducible -- and auditable for CVEs'
    - title: Lock the Infrastructure
      intent: Infrastructure dependencies drift too; a committed provider lock keeps applies deterministic.
      languages:
      - name: HCL
        slug: hcl
        code: "# Terraform: same lesson, infrastructure edition\n# SMELL: unconstrained provider -> drift\
          \ between applies\nterraform {\n  required_providers { aws = {} }\n}\n\n# RIGHT: pin the provider\
          \ and commit .terraform.lock.hcl\nterraform {\n  required_providers {\n    aws = { source =\
          \ \"hashicorp/aws\", version = \"~> 5.40\" }\n  }\n}"
        explanation: Infrastructure dependencies drift too. A committed provider lock keeps terraform
          apply reproducible across the team.
        output: 'unpinned: provider upgrades silently change infra

          locked:   plan/apply are deterministic'
  - slug: injection-taint-flaws
    cwes:
    - id: CWE-74
      name: Improper Neutralization of Special Elements in Output Used by a Downstream Component ('Injection')
      url: https://cwe.mitre.org/data/definitions/74.html
    - id: CWE-89
      name: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')
      url: https://cwe.mitre.org/data/definitions/89.html
    - id: CWE-78
      name: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')
      url: https://cwe.mitre.org/data/definitions/78.html
    - id: CWE-79
      name: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')
      url: https://cwe.mitre.org/data/definitions/79.html
    name: Injection & Taint Flaws (SAST)
    tagline: untrusted input flowing into a dangerous sink
    essence: Static analysis traces a tainted source to a sink; the fix is to break the flow.
    description: SAST reads the source you wrote and follows untrusted data into dangerous sinks -- SQL,
      the shell, the filesystem -- plus hardcoded secrets and weak crypto. These are the defects a static
      scanner flags before the code ever runs.
    examples:
    - title: SQL Injection
      intent: Untrusted input concatenated into a query is the classic source-to-sink flow.
      languages:
      - name: Python
        slug: python
        code: '# SMELL: untrusted input concatenated into SQL (the classic sink)

          q = "SELECT * FROM users WHERE name = ''" + name + "''"

          db.execute(q)               # name = "'' OR ''1''=''1" dumps the table


          # RIGHT: parameterize -- data never becomes code

          db.execute("SELECT * FROM users WHERE name = ?", (name,))'
        explanation: SAST traces the tainted name from an untrusted source into the query sink. Parameterized
          queries keep data and code separate.
        output: 'concat: '' OR ''1''=''1 returns every row

          param:  the input is data, never SQL'
      - name: Java
        slug: java
        code: "// SMELL: a string-built query -> injectable\nString q = \"SELECT * FROM acct WHERE id\
          \ = \" + req.getParameter(\"id\");\nstmt.executeQuery(q);\n\n// RIGHT: PreparedStatement binds\
          \ the value safely\nPreparedStatement ps = conn.prepareStatement(\n    \"SELECT * FROM acct\
          \ WHERE id = ?\");\nps.setInt(1, Integer.parseInt(req.getParameter(\"id\")));"
        explanation: The request parameter is tainted source; the query is the sink. Binding parameters
          (and parsing to int) breaks the injection.
        output: 'concat:   1 OR 1=1 leaks all accounts

          prepared: only a valid id is accepted'
    - title: Command Injection & Path Traversal
      intent: Input handed to a shell or a file path escapes into commands and directories you never intended.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// SMELL: user input handed straight to a shell

          exec(`convert ${userFile} out.png`);   // userFile = "x; rm -rf /"


          // RIGHT: no shell; pass arguments as an array

          execFile("convert", [userFile, "out.png"]);'
        explanation: String-interpolating input into a shell command is a sink. execFile bypasses the
          shell, so metacharacters are inert.
        output: 'exec:     ''; rm -rf /'' runs as a command

          execFile: the filename is just an argument'
      - name: Python
        slug: python
        code: "# SMELL: user-controlled path escapes the intended directory\npath = os.path.join(UPLOADS,\
          \ request.args[\"name\"])   # name = \"../../etc/passwd\"\nreturn open(path).read()\n\n# RIGHT:\
          \ resolve and confirm it stays inside UPLOADS\nfull = os.path.realpath(os.path.join(UPLOADS,\
          \ name))\nif not full.startswith(UPLOADS):\n    abort(403)\nreturn open(full).read()"
        explanation: ../ sequences in tainted input walk outside the upload dir. Resolve the real path
          and verify containment before opening.
        output: 'naive:   reads /etc/passwd

          guarded: 403 on any escape attempt'
    - title: Hardcoded Secrets
      intent: A credential committed in source leaks through the repo and can't be rotated without a deploy.
      languages:
      - name: Python
        slug: python
        code: '# SMELL: a secret committed in source -- SAST and secret scanners flag this

          API_KEY = "sk_live_51H8xQ2eZvKf9pQ"      # now in git history forever


          # RIGHT: read from the environment / a secret manager

          API_KEY = os.environ["API_KEY"]'
        explanation: 'Hardcoded credentials are a static-analysis red flag: they leak through the repo''s
          history and can''t be rotated without a code change.'
        output: 'hardcoded: leaked the moment the repo is shared

          env var:   rotate without touching code'
  - slug: runtime-integration-flaws
    cwes:
    - id: CWE-352
      name: Cross-Site Request Forgery (CSRF)
      url: https://cwe.mitre.org/data/definitions/352.html
    - id: CWE-918
      name: Server-Side Request Forgery (SSRF)
      url: https://cwe.mitre.org/data/definitions/918.html
    - id: CWE-601
      name: URL Redirection to Untrusted Site ('Open Redirect')
      url: https://cwe.mitre.org/data/definitions/601.html
    - id: CWE-200
      name: Exposure of Sensitive Information to an Unauthorized Actor
      url: https://cwe.mitre.org/data/definitions/200.html
    name: Runtime & Integration Flaws (DAST)
    tagline: defects you only see when the app is running
    essence: DAST pokes the live app from outside; these bugs hide in behavior, not source.
    description: 'Dynamic testing exercises the running system from the perimeter: reflected XSS, crash-under-malformed-input,
      and security misconfiguration. They are invisible to a static read of any single function -- you
      have to run the thing to see them.'
    examples:
    - title: Reflected XSS
      intent: User input echoed into HTML unescaped runs as script -- a dynamic scan watches the alert
        fire.
      languages:
      - name: JavaScript
        slug: javascript
        code: "// SMELL: user input echoed into HTML unescaped\napp.get(\"/hi\", (req, res) =>\n  res.send(`<h1>Hello\
          \ ${req.query.name}</h1>`));   // name = <script>...\n\n// RIGHT: escape on output (or use an\
          \ auto-escaping template engine)\napp.get(\"/hi\", (req, res) =>\n  res.send(`<h1>Hello ${escapeHtml(req.query.name)}</h1>`));"
        explanation: A dynamic scan submits <script> and watches it execute -- a defect invisible in a
          static read of one function. Escape untrusted data on output.
        output: 'raw:     <script>alert(1)</script> runs

          escaped: shown as literal text'
    - title: Crash Under Malformed Input -> DoS
      intent: An unbounded, unvalidated parameter is a denial-of-service waiting to be fuzzed.
      languages:
      - name: Python
        slug: python
        code: "# SMELL: unhandled parse + unbounded work takes the worker down\n@app.post(\"/calc\")\n\
          def calc():\n    n = int(request.form[\"n\"])     # \"abc\" -> ValueError -> 500, repeatable\n\
          \    return str(fib(n))             # n = 10_000_000 -> CPU exhaustion\n\n# RIGHT: validate\
          \ and bound before doing work\nn = request.form.get(\"n\", \"\")\nif not n.isdigit() or int(n)\
          \ > 1000:\n    abort(400)"
        explanation: DAST fuzzes the endpoint and finds inputs that crash or hang it. Validate and bound
          every parameter -- software that crashes becomes a Denial of Service.
        output: 'naive:   ''abc'' -> 500; huge n -> hung worker

          bounded: a clean 400, work stays cheap'
    - title: Security Misconfiguration
      intent: Verbose errors and permissive defaults shipped to production are exposures a scanner finds
        at the perimeter.
      languages:
      - name: JavaScript
        slug: javascript
        code: '// SMELL: debug errors and wildcard CORS shipped to production

          app.use(errorhandler());              // leaks stack traces to clients

          app.use(cors({ origin: "*" }));       // any site can call your API


          // RIGHT: prod-safe errors; lock the origin

          if (PROD) app.use(genericErrorPage());

          app.use(cors({ origin: ["https://app.example.com"] }));'
        explanation: 'Misconfiguration is what DAST catches at the perimeter: verbose errors leak internals
          and wildcard CORS invites abuse. Ship hardened defaults.'
        output: 'open:   stack traces + any-origin requests

          locked: generic errors, allowlisted origins'
      - name: HCL
        slug: hcl
        code: "# SMELL: a storage bucket left open to the world\nresource \"aws_s3_bucket_acl\" \"data\"\
          \ {\n  acl = \"public-read\"           # anyone can list and read objects\n}\n\n# RIGHT: private\
          \ by default; grant access explicitly\nresource \"aws_s3_bucket_acl\" \"data\" {\n  acl = \"\
          private\"\n}"
        explanation: Infrastructure misconfiguration is the same defect at the cloud layer -- a public
          bucket is a runtime exposure a config scan or DAST will flag.
        output: 'public-read: objects exposed to the internet

          private:     access only via explicit grants'
cascade:
  intro: A code smell is not the bug. It is the smell of one nearby.
  stages:
  - label: Code Smell
    note: A pattern that hints at a structural problem. Rotting code does not cause smells — code causes
      smells.
  - label: Software Defect
    note: The latent fault the smell was pointing at. It may pass every test and still be there.
  - label: Vulnerability
    note: What the defect becomes once it ships and meets the real world.
  exploits:
  - defect: Software that crashes
    becomes: a Denial-of-Service attack
  - defect: Edge cases & complexity
    becomes: an Abuse of Terms
  - defect: Race conditions & lag
    becomes: a way to cheat and scam
  kicker: This is why we can't have nice things.
two_hard_problems:
- naming things
- off-by-one errors
- cache invalidation
