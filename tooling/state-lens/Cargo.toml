[package]
name = "state-lens"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "=0.25.10"
tree-sitter-go = "=0.25.0"
tree-sitter-rust = "=0.24.0"
tree-sitter-typescript = "=0.23.2"
url = "2"

[profile.release]
lto = "thin"
